<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>અલ્ટરનેટર લેબ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Alternator lab — same layout as the engine lab. Layout: ITI lab page — header with language switch, sticky tabs (Simulator · Theory · MCQ); simulator = big 3D bay with part-name banner (sticky on desktop) + stacked control cards. */
:root{
  --bg:#f3efe7;--panel:#fffdf9;--panel2:#f7f2e8;--ink:#1c232c;--mute:#5d6672;--line:#ddd5c6;
  --acc:#e2620b;--acc2:#b84d06;--accInk:#fff;--hl:#d4147f;--hlSoft:#d4147f1f;
  --in:#0284c7;--cmp:#d35400;--pow:#d4a000;--exh:#111111;--ok:#16884a;--bad:#d42a2a;
  --bay:#dfe7ee;--shadow:0 1px 0 #0000000a,0 6px 18px -10px #3a2a1040;
  --fd:"Baloo Bhai 2","Noto Sans Gujarati","Noto Sans Devanagari",system-ui,sans-serif;
  --fb:"Noto Sans Gujarati","Noto Sans Devanagari","Baloo Bhai 2",system-ui,sans-serif;
  --fm:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151a;--panel:#191f26;--panel2:#1f262f;--ink:#e8ecf0;--mute:#97a2ae;--line:#2c3540;
  --acc:#ff7a22;--acc2:#ff9a52;--accInk:#1a0d02;--hl:#ff4fb0;--hlSoft:#ff4fb02a;
  --in:#7dd3fc;--cmp:#ff8c42;--pow:#ffe14d;--exh:#9ca3af;--ok:#3fcf7d;--bad:#ff5c5c;
  --bay:#1a222b;--shadow:0 1px 0 #0000,0 8px 22px -12px #000c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151a;--panel:#191f26;--panel2:#1f262f;--ink:#e8ecf0;--mute:#97a2ae;--line:#2c3540;
  --acc:#ff7a22;--acc2:#ff9a52;--accInk:#1a0d02;--hl:#ff4fb0;--hlSoft:#ff4fb02a;
  --in:#7dd3fc;--cmp:#ff8c42;--pow:#ffe14d;--exh:#9ca3af;--ok:#3fcf7d;--bad:#ff5c5c;
  --bay:#1a222b;--shadow:0 1px 0 #0000,0 8px 22px -12px #000c;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--fb);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px 40px}
/* embedded in a blog iframe that sizes itself to the page: fixed heights (vh would grow the frame forever) */
html.embed .bay{height:460px}@media (min-width:980px){html.embed .bay,html.embed .simmain.demo .bay{height:720px;max-height:none}html.embed .simmain.demo .bay{height:560px}}
html.embed body.fs .bay{height:calc(100vh - 96px)}
body.fs .wrap{max-width:none;padding-top:8px}body.fs .bay{max-height:none!important}
body.fsx{position:fixed;inset:0;overflow:auto;z-index:100;background:var(--bg)}
#fsBtn{font-weight:700;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);line-height:1.2;text-wrap:balance;margin:0}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 10px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--acc);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 #0003}
.logo svg{width:32px;height:32px}
.brand{flex:1 1 220px;min-width:0}
.brand h1{font-size:clamp(21px,4.6vw,30px);font-weight:800}
.brand p{margin:0;color:var(--mute);font-size:13px}
.hctl{display:flex;gap:8px;align-items:center;margin-left:auto}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel2);padding:7px 11px;font-size:13px;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:6px 0 10px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 2px;font-family:var(--fd);font-weight:700;font-size:clamp(13px,3.4vw,17px);line-height:1.2;box-shadow:0 3px 0 var(--line)}
.tab .ti{display:block;font-size:19px;line-height:1.1}
.tab[aria-selected="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.ctitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--fd);font-weight:700;font-size:17px;margin-bottom:8px}
.ctitle small{font-family:var(--fb);font-weight:400;color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--line);line-height:1.2}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--acc);border-color:var(--acc2);color:var(--accInk);box-shadow:0 2px 0 var(--acc2)}
.btn.grn{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 2px 0 #0b5c31}
.btn.on{outline:2.5px solid var(--acc);outline-offset:-2px;background:color-mix(in srgb,var(--acc) 12%,var(--panel))}
input[type=range]{width:100%;accent-color:var(--acc);height:26px}

/* simulator layout */
.simgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.bay{scroll-margin-top:84px;position:relative;height:62vh;min-height:360px;border-radius:18px;overflow:hidden;background:var(--bay);border:1px solid var(--line);box-shadow:var(--shadow)}
@media (min-width:980px){.simgrid{grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr)}.simmain{position:sticky;top:78px;align-self:start}.bay{height:calc(100vh - 96px);max-height:780px}.side{display:grid;gap:12px;align-content:start}.simmain.demo .bay{height:calc(100vh - 290px);min-height:380px}}
@media (max-width:979px){.side{display:grid;gap:12px}}
#view{position:absolute;inset:0;cursor:grab}
#view.pick{cursor:pointer}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.banner{position:absolute;left:10px;right:10px;top:10px;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:2px solid var(--c,var(--line));box-shadow:0 6px 18px -8px #0006;pointer-events:none;transition:border-color .2s}
.banner .num{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--c,var(--mute));color:#fff;display:grid;place-items:center;font-family:var(--fm);font-weight:700;font-size:15px;padding:0 6px}
.banner .bt{min-width:0}
.banner .bn{font-family:var(--fd);font-weight:800;font-size:clamp(18px,3.4vw,26px);line-height:1.1;color:var(--ink)}
.banner .bs{font-size:12.5px;color:var(--mute);font-weight:600}
.banner.empty .bn{font-size:clamp(15px,2.8vw,19px);color:var(--mute)}
.banner.quiz{--c:var(--hl)}
.boost{margin-top:6px;font-size:13px;color:var(--mute)}.boost b{color:#0891b2}
.banner .cd{position:absolute;left:0;bottom:0;height:5px;border-radius:0 0 0 12px;background:var(--c,var(--acc));width:0}
.demoCap{margin-top:10px;padding:10px 12px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--acc);box-shadow:var(--shadow)}
.dcTop{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dcStep{font-size:12px;font-weight:700;color:#fff;background:var(--acc);border-radius:999px;padding:1px 10px}
.dcBtns{display:flex;gap:4px}
.dcBtns button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;width:36px;height:32px;font-size:15px}
.dcTitle{font-family:var(--fd);font-weight:800;font-size:clamp(17px,2.6vw,22px);margin:6px 0 2px;color:var(--acc2)}
.dcText{font-size:14.5px;line-height:1.55}
.dcText .dcSub{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.dcBar{height:5px;border-radius:3px;background:var(--panel2);margin-top:8px;overflow:hidden}
.dcBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#9333ea)}
.demo .dbtns{display:grid;grid-template-columns:1fr;gap:6px}
.demo .dbtns .btn{text-align:left;font-size:15px;padding:10px 12px}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;font-weight:700;color:var(--mute)}
.demo .chip{box-shadow:none}
.smokecap{font-size:12.5px;color:var(--mute);margin:4px 0 0}
.galleg{position:absolute;right:10px;top:76px;z-index:4;display:grid;gap:3px;padding:6px 10px;border-radius:12px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);font-size:12.5px;font-weight:700;pointer-events:none}
.galleg i{display:inline-block;width:22px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.gaslab{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-50%);padding:2px 6px;border-radius:8px;background:var(--c);color:#fff;font:700 10.5px/1.25 var(--fm);text-align:center;white-space:nowrap;box-shadow:0 2px 6px #0005}
.cyl .pt{display:block;font-family:var(--fm);font-size:11px;color:var(--ink);line-height:1.35;font-variant-numeric:tabular-nums}
.cyl .ev{display:block;font-style:normal;font-size:11.5px;font-weight:700;min-height:17px;color:var(--c)}
.pbar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:var(--c);width:0}
.tag3d{position:absolute;z-index:3;pointer-events:none;transform:translate(-50%,-100%);padding:3px 9px;border-radius:999px;background:var(--c,#333);color:#fff;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 3px 8px #0004}
.tag3d::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:14px;background:var(--c,#333);transform:translateX(-50%)}
.mini{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-50%);padding:1px 6px;border-radius:999px;background:var(--c,#333);color:#fff;font-weight:700;font-size:11px;white-space:nowrap;opacity:.92}
.tip{position:absolute;z-index:5;pointer-events:none;padding:4px 9px;background:var(--ink);color:var(--bg);border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;transform:translate(12px,14px)}
.bayctl{position:absolute;left:10px;bottom:10px;right:10px;z-index:4;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.bayctl>*{pointer-events:auto}
.chip{border:1.5px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;box-shadow:0 2px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc2);box-shadow:0 2px 0 var(--acc2)}

/* inspector */
.insp .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#fff;background:var(--c,var(--mute));border-radius:999px;padding:2px 10px}
.insp h2{font-size:24px;font-weight:800;margin:6px 0 4px;color:var(--c,var(--ink))}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line)}
.pill.ready{border-color:var(--acc);color:var(--acc2);background:color-mix(in srgb,var(--acc) 10%,var(--panel))}
.pill.removed{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.pill.blocked{color:var(--mute)}
.desc{margin:8px 0;font-size:15px}
.prow2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;margin:8px 0;font-size:14px;padding:8px 10px;border-radius:12px;background:var(--panel2)}
.prow2 b{font-family:var(--fd);color:var(--mute);font-size:13.5px;white-space:nowrap}
.why{font-size:13.5px;border-left:4px solid var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 9%,var(--panel));border-radius:10px;padding:6px 10px;margin:8px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.hintl{margin:6px 0 0;padding-left:20px;font-size:14px}
.hintl li{margin:3px 0}

/* step card */
.next{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.next .what{flex:1 1 160px;min-width:0}
.next .what small{display:block;font-size:12px;color:var(--mute);font-weight:700}
.next .what strong{font-family:var(--fd);font-size:19px;line-height:1.2}
.prog{height:12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#0ea5e9,#9333ea);width:0;transition:width .35s}
.progt{font-size:12.5px;color:var(--mute);font-weight:700}
.row3{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* controls */
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0;font-size:13.5px;font-weight:700;color:var(--mute)}
.crow output{font-family:var(--fm);color:var(--ink);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.togs{display:flex;gap:6px;flex-wrap:wrap}

/* cycle */
.cyc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cyl{border-radius:12px;padding:6px 8px;background:color-mix(in srgb,var(--c,var(--mute)) 14%,var(--panel));border:2px solid var(--c,var(--line));text-align:center;min-width:0;transition:background .2s,border-color .2s}
.cyl b{display:block;font-family:var(--fm);font-size:11.5px;color:var(--mute)}
.cyl span{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--c,var(--ink))}
.cyclegend{font-size:12.5px;color:var(--mute);margin-top:6px}

/* parts list */
.stage{margin:10px 0 4px;font-family:var(--fd);font-weight:800;font-size:14px;color:var(--acc2);display:flex;align-items:center;gap:6px}
.stage::after{content:"";flex:1;height:1px;background:var(--line)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--panel2);border-radius:12px;padding:5px 8px;font-size:13.5px;font-weight:600}
.prow i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--fm);font-size:11.5px;font-weight:700}
.prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .st{font-size:14px}
.prow.removed{opacity:.6}
.prow.removed .nm{text-decoration:line-through}
.prow.ready{border-color:var(--acc)}
.prow[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--panel));box-shadow:0 0 0 2px var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--mute);margin-top:8px}
.syschips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.syschips span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px 1px 4px;background:var(--panel2);border:1px solid var(--line)}
.syschips span i{width:12px;height:12px;border-radius:50%;background:var(--c)}

/* identify game */
.gq{font-family:var(--fd);font-weight:800;font-size:18px;margin:4px 0 8px}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:9px 11px;font-size:15px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-family:var(--fm);font-size:12px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel));box-shadow:0 3px 0 var(--ok)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel));box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gscore{display:flex;gap:12px;flex-wrap:wrap;font-weight:800;font-size:14px;color:var(--mute)}
.gscore b{color:var(--ink);font-family:var(--fm)}

/* theory */
.th{display:grid;gap:12px;max-width:860px;margin:0 auto}
.thhero{text-align:center;padding:6px 6px 0}
.thhero p{color:var(--mute);margin:4px 0 0}
.th .card h2{font-size:21px;font-weight:800;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.th .card h2 .n{font-family:var(--fm);font-size:13px;color:var(--accInk);background:var(--acc);border-radius:8px;padding:1px 7px}
.th p{margin:.45em 0}
.th ul,.th ol{margin:.3em 0;padding-left:1.3em}
.th li{margin:.25em 0}
.tb{border-radius:12px;padding:8px 12px;margin:8px 0;font-size:15px;line-height:1.6;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--panel))}
.tb>b:first-child{color:var(--c)}
.formula{font-family:var(--fm);font-weight:700;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.7;overflow-x:auto}
.strokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:8px 0}
.sk{border:2px solid var(--c);border-radius:14px;padding:10px;background:color-mix(in srgb,var(--c) 9%,var(--panel));font-size:14px}
.sk b{display:block;font-family:var(--fd);font-size:19px;color:var(--c);line-height:1.1}
.sk small{display:block;color:var(--mute);font-weight:700;margin:2px 0 4px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2);font-family:var(--fd)}
.tbl td.c{text-align:center;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.see{margin-top:6px;border:1.5px solid var(--hl);color:var(--hl);background:var(--hlSoft);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13.5px}

/* mcq */
.mq{max-width:760px;margin:0 auto;display:grid;gap:12px}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.score{font-family:var(--fd);font-weight:800;font-size:18px}
.score b{color:var(--ok)}
.mprog{flex:1;min-width:120px;height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.mprog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.qno{font-family:var(--fm);font-size:12px;color:var(--mute)}
.qtext{font-family:var(--fd);font-weight:700;font-size:20px;margin:4px 0 10px;line-height:1.35}
.opts{display:grid;gap:8px}
.mq .opt{font-size:16px;padding:10px 12px}
.expl{border-radius:14px;padding:10px 12px;font-size:15px;background:var(--panel2);border-left:5px solid var(--ok)}
.expl.bad{border-left-color:var(--bad)}
.expl b.v{display:block;font-family:var(--fd);font-size:17px}

function mergeList(geos){let n=0;const parts=geos.map(g=>{const q=g.index?g.toNonIndexed():g;if(!q.attributes.normal)q.computeVertexNormals();n+=q.attributes.position.count;return q;});

// parametric surface patch f(u,v) -> Vector3 on a (nu x nv) grid
function patch(nu,nv,f){const pos=[],uv=[],idx=[];for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){const p=f(i/nu,j/nv);pos.push(p.x,p.y,p.z);uv.push(i/nu,j/nv);}

function resample(poly,step){const out=[];const n=poly.length;let carry=0;for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];const dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy);let t=carry;while(t<L){out.push([a[0]+dx*t/L,a[1]+dy*t/L]);t+=step;}carry=t-L;}return out;}

  d:A('6 ખાંચાવાળી સ્ટીલની પુલી. નાનો વ્યાસ (≈ 54 mm) એટલે અલ્ટરનેટર એન્જિન કરતાં ≈ 2.7 ગણું ઝડપથી ફરે — ધીમી ઝડપે પણ ચાર્જિંગ મળે. ઘણી નવી ગાડીઓમાં વન-વે ક્લચવાળી (OAP/OAD) પુલી હોય.','6 खाँचे वाली स्टील पुली. छोटा व्यास (≈ 54 mm) यानी अल्टरनेटर इंजन से ≈ 2.7 गुना तेज़ घूमता है — धीमी गति पर भी चार्जिंग मिले. कई नई गाड़ियों में वन-वे क्लच वाली (OAP/OAD) पुली होती है.','Steel pulley with 6 grooves. Its small diameter (≈ 54 mm) spins the alternator ≈ 2.7 × faster than the engine, so it charges even at idle. Many newer cars use a one-way clutch pulley (OAP/OAD).'),

/* performance: merge static meshes that share a material into one draw call per container */
function mergeGeos(list){const parts=list.map(({geo,mat})=>{let g=geo.index?geo.toNonIndexed():geo.clone();g.applyMatrix4(mat);if(!g.attributes.normal)g.computeVertexNormals();return g;});
  let n=0;parts.forEach(g=>n+=g.attributes.position.count);const P_=new Float32Array(n*3),N_=new Float32Array(n*3),U_=new Float32Array(n*2);let o=0;
  parts.forEach(g=>{const c=g.attributes.position.count;P_.set(g.attributes.position.array,o*3);N_.set(g.attributes.normal.array,o*3);if(g.attributes.uv)U_.set(g.attributes.uv.array,o*2);o+=c;g.dispose();});
  const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(P_,3));m.setAttribute('normal',new THREE.BufferAttribute(N_,3));m.setAttribute('uv',new THREE.BufferAttribute(U_,2));m.computeBoundingSphere();return m;}
function mergeStatic(root){const conts=[];root.traverse(o=>{if(!o.isMesh&&!o.userData.st)conts.push(o);});
  conts.forEach(c=>{const by=new Map();const add=(mesh,mat,owner)=>{const k=mesh.material;if(!by.has(k))by.set(k,[]);by.get(k).push({geo:mesh.geometry,mat,owner});};
    c.children.slice().forEach(ch=>{ch.updateMatrix();
      if(ch.isMesh&&!ch.name&&!ch.userData.keep&&!ch.children.length&&ch.renderOrder===0)add(ch,ch.matrix.clone(),ch);
      else if(ch.userData.st&&!ch.isMesh){ch.children.forEach(m=>{if(m.isMesh){m.updateMatrix();add(m,ch.matrix.clone().multiply(m.matrix),ch);}});}});
    by.forEach((list,mat)=>{if(list.length<2)return;const mm=new THREE.Mesh(mergeGeos(list),mat);c.add(mm);list.forEach(it=>{if(it.owner.parent)c.remove(it.owner);});});});}

      tmpV2.copy(ex).multiplyScalar(1-e2).addScaledVector(p.dirV,p.pull*e1).add(pp).lerp(p.benchPos,e2);tmpV2.y+=Math.sin(Math.PI*e2)*p.lift;

    else{const ease=t*t*(3-2*t);g.position.copy(ex).addScaledVector(p.dirV,ease*(p.dist*0.6+2.0));g.rotation.z=0;fade=1-smooth(0.45,1,t);}
    p.fade=fade;g.visible=fade>0.01;
    const onBench=p.benchPos&&t>0.5;
    const ghost=state.xray&&(p.housing||p.xsee)&&!state.iso&&state.quiz!==id&&!onBench;
    const clip=state.cut&&!p.noclip&&!state.iso&&state.quiz!==id&&!onBench&&!(par&&par.t>0.5);
    let em=BLACK;
    if(state.quiz===id){tmpC.copy(HL_Q).multiplyScalar(0.55+0.45*Math.sin(now*0.006));em=tmpC;}
    else if(state.sel===id&&!state.quiz)em=HL_SEL;else if(state.hover===id&&!state.quiz)em=HL_HOV;
    for(const m of p.mats){const u=m.userData;const op=Math.min(fade,ghost?0.13:(state.xray&&u.xg&&!state.iso&&!onBench&&state.quiz!==id?0.16:1));
      if(!u.tag||em!==BLACK)m.emissive&&m.emissive.copy(em);m.opacity=op;m.depthWrite=u.decal?false:op>=0.5;
      const key=(op<1)+'|'+clip;if(u.k!==key){u.k=key;m.transparent=op<1||u.transparent;m.clippingPlanes=clip?[cutPlane]:null;m.side=clip?THREE.DoubleSide:u.side;m.needsUpdate=true;}}
    const k2=(fade<1||ghost)?30:0;if(p.ro!==k2){p.ro=k2;g.traverse(o=>{if(o.isMesh)o.renderOrder=k2;});}
  });
}

const status=p=>p.fixed?'fixed':p.removed?'removed':p.requires.every(r=>P[r].removed)?'ready':'blocked';
const canInstall=p=>p.removed&&p.dependents.every(d=>!P[d].removed);
const removable=ORDER.filter(id=>!P[id].fixed);
const stepNo=id=>ORDER.indexOf(id)+1;
function nextPart(){return ORDER.map(id=>P[id]).find(p=>status(p)==='ready');}
function removePart(id,quiet){const p=P[id];if(status(p)!=='ready')return false;
  if(!quiet&&(state.running||state.key)&&['bNut','harness'].includes(id)){state.running=false;state.key=false;setTog($('tRun'),false);setTog($('tKey'),false);toast('⚠️ '+tx('સલામતી: મોટર અને ચાવી બંધ કરી, બેટરી (−) કાઢી','सुरक्षा: मोटर और चाबी बंद की, बैटरी (−) निकाली','Safety: motor and key switched off, battery (−) disconnected'));}
  if(!quiet&&state.running&&id==='belt'){state.running=false;setTog($('tRun'),false);}
  p.removed=true;state.stack.push(id);if(state.iso===id)state.iso=null;if(!quiet){SND.wrench();buzz(20);}state.sel=id;refresh();return true;}
function installPart(id,quiet){const p=P[id];if(!canInstall(p))return false;p.removed=false;const i=state.stack.lastIndexOf(id);if(i>=0)state.stack.splice(i,1);if(!quiet)SND.fit();refresh();return true;}
function undo(){for(let i=state.stack.length-1;i>=0;i--){if(installPart(state.stack[i]))return;}}
function stripTo(id){let guard=0;while(!P[id].removed&&guard++<40){const n=nextPart();if(!n)break;removePart(n.id,true);}refresh();}
function buildAll(){let guard=0;while(state.stack.length&&guard++<60)installPart(state.stack[state.stack.length-1],true);refresh();}

  svg:()=>SV.altr(240,95)+SV.batt(30,120)+SV.meter(130,20,'14.4')+SV.red('M147 90 Q120 110 47 112')+SV.blk('M175 90 Q150 150 103 112'),
  run(){applyBench({key:true,run:true,rpm:2000,loads:{base:true}});const r=simAt({key:true,run:true,rpm:2000,loads:{base:true}});const v=jit(r.U,0.03);return {v:fmt(v,2),u:'V',pass:v>=13.8&&v<=14.8,note:v>14.8?A('ઓવરચાર્જ — રેગ્યુલેટર ખરાબ (ફિલ્ડ સતત ચાલુ). તરત બદલો, નહીં તો બેટરી ઉકળશે.','ओवरचार्ज — रेगुलेटर खराब (फील्ड लगातार चालू). तुरंत बदलें, वरना बैटरी उबलेगी.','Overcharging — regulator faulty (field stuck on). Replace now or the battery will boil.'):v<13.8?A('અંડરચાર્જ/ચાર્જિંગ નહીં — લેમ્પ, આઉટપુટ અને વોલ્ટેજ-ડ્રોપ ટેસ્ટ કરો.','अंडरचार्ज/चार्जिंग नहीं — लैम्प, आउटपुट और वोल्टेज-ड्रॉप टेस्ट करें.','Undercharging/not charging — do the lamp, output and voltage-drop tests.'):A('રેગ્યુલેટર બરાબર કામ કરે છે.','रेगुलेटर ठीक काम कर रहा है.','The regulator is working.')};}},
 {id:'c4',grp:'car',ic:'🔥',n:A('મહત્તમ આઉટપુટ (લોડ) ટેસ્ટ','अधिकतम आउटपुट (लोड) टेस्ट','Maximum output (load) test'),tool:A('ક્લેમ્પ મીટર + કાર્બન-પાઇલ લોડર','क्लैम्प मीटर + कार्बन-पाइल लोडर','Clamp meter + carbon-pile load tester'),mode:'A ⎓',spec:A('≥ 108 A (રેટેડ 120 A ના ≥ 90%) @ 13.5 V','≥ 108 A (रेटेड 120 A के ≥ 90%) @ 13.5 V','≥ 108 A (≥ 90% of rated 120 A) @ 13.5 V'),
  steps:[A('ક્લેમ્પ મીટર B+ કેબલ પર (તીર બેટરી તરફ). એન્જિન 2500 rpm.','क्लैम्प मीटर B+ केबल पर (तीर बैटरी की ओर). इंजन 2500 rpm.','Clamp meter on the B+ cable (arrow towards the battery). Engine 2500 rpm.'),A('બધા લોડ ચાલુ + કાર્બન પાઇલથી વોલ્ટેજ 13.5 V સુધી નીચું લાવો. 15 સેકન્ડથી વધુ નહીં!','सभी लोड चालू + कार्बन पाइल से वोल्टेज 13.5 V तक नीचे लाएँ. 15 सेकंड से ज़्यादा नहीं!','All loads on + carbon pile to pull the voltage down to 13.5 V. No longer than 15 seconds!'),A('મળેલો કરંટ ≥ રેટેડના 90% હોવો જોઈએ.','मिला करंट ≥ रेटेड का 90% होना चाहिए.','Current must be ≥ 90% of the rating.')],
  svg:()=>SV.altr(70,95)+SV.batt(210,120)+'<path d="M88 109 C140 70 200 70 227 112" fill="none" stroke="#c81e1e" stroke-width="6"/><ellipse cx="160" cy="80" rx="16" ry="26" fill="none" stroke="#f2c230" stroke-width="8"/><rect x="146" y="20" width="30" height="40" rx="6" fill="#f2c230" stroke="#8a6508"/><text x="161" y="45" text-anchor="middle" style="font-size:10px;fill:#111">A</text>',
  run(){applyBench({key:true,run:true,rpm:2500,loads:ALL_LOADS()});const r=simAt({key:true,run:true,rpm:2500,loads:ALL_LOADS()});const v=Math.max(0,jit(r.Imax,1.2));return {v:fmt(v,0),u:'A',pass:v>=108,note:v>=108?A('અલ્ટરનેટર પૂરો કરંટ આપે છે.','अल्टरनेटर पूरा करंट दे रहा है.','The alternator delivers full output.'):A('આઉટપુટ ઓછું: 60–75% = એક ડાયોડ કે એક ફેઝ ખરાબ; 25–50% = શોર્ટ ડાયોડ/સ્ટેટર અર્થ; 0 = ફિલ્ડ સર્કિટ (બ્રશ/રોટર/રેગ્યુલેટર); બેલ્ટ ચીસ = સ્લિપ.','आउटपुट कम: 60–75% = एक डायोड या एक फेज़ खराब; 25–50% = शॉर्ट डायोड/स्टेटर अर्थ; 0 = फील्ड सर्किट (ब्रश/रोटर/रेगुलेटर); बेल्ट चीख = स्लिप.','Low output: 60–75% = one diode or one phase bad; 25–50% = shorted diode/earthed stator; 0 = field circuit (brushes/rotor/regulator); squeal = belt slip.')};}},
 {id:'c5',grp:'car',ic:'🔻',n:A('B+ સાઇડ વોલ્ટેજ ડ્રોપ','B+ साइड वोल्टेज ड्रॉप','B+ side voltage drop'),tool:A('મલ્ટિમીટર (V⎓, લાંબા લીડ)','मल्टीमीटर (V⎓, लंबे लीड)','Multimeter (V⎓, long leads)'),mode:'V ⎓',spec:A('≤ 0.3 V (≈ 50 A લોડ પર)','≤ 0.3 V (≈ 50 A लोड पर)','≤ 0.3 V (at ≈ 50 A load)'),
  steps:[A('લાલ પ્રોબ અલ્ટરનેટરના B+ સ્ટડ પર, કાળી પ્રોબ બેટરી (+) પર — બંને "ઉપરની" બાજુ.','लाल प्रोब अल्टरनेटर के B+ स्टड पर, काली प्रोब बैटरी (+) पर — दोनों "ऊपर" की ओर.','Red probe on the alternator B+ stud, black on battery (+) — both on the "positive" side.'),A('એન્જિન 2000 rpm, હેડલેમ્પ + બ્લોઅર + ડિફોગર ચાલુ (≈ 50 A).','इंजन 2000 rpm, हेडलैम्प + ब्लोअर + डिफॉगर चालू (≈ 50 A).','Engine 2000 rpm, headlamps + blower + defogger on (≈ 50 A).'),A('મીટર કેબલમાં "ખોવાતો" વોલ્ટેજ બતાવે. વધુ હોય તો ટર્મિનલ સાફ કરી કસો.','मीटर केबल में "खोया" वोल्टेज दिखाता है. ज़्यादा हो तो टर्मिनल साफ करके कसें.','The meter shows voltage "lost" in the cable. If high, clean and tighten the terminals.')],
  svg:()=>SV.altr(70,95)+SV.batt(210,120)+'<path d="M88 109 C140 150 200 150 227 112" fill="none" stroke="#c81e1e" stroke-width="5"/>'+SV.meter(130,10,'0.12')+SV.red('M147 80 Q110 90 88 108')+SV.blk('M175 80 Q210 80 227 112'),
  run(){applyBench({key:true,run:true,rpm:2000,loads:MID_LOADS()});const r=simAt({key:true,run:true,rpm:2000,loads:MID_LOADS()});const v=Math.max(0,jit(r.I*(state.fault==='bplusRes'?0.016:0.0025),0.01));return {v:fmt(v,2),u:'V',pass:v<=0.3,note:v<=0.3?A('B+ કેબલ અને ટર્મિનલ બરાબર.','B+ केबल और टर्मिनल ठीक.','B+ cable and terminals are fine.'):A('B+ બાજુ વધુ પ્રતિકાર: કાટવાળું/ઢીલું ટર્મિનલ, ફ્યુઝિબલ લિંક કે કેબલ. ટર્મિનલ ગરમ પણ થશે.','B+ ओर ज़्यादा प्रतिरोध: जंग लगा/ढीला टर्मिनल, फ्यूज़िबल लिंक या केबल. टर्मिनल गर्म भी होगा.','High resistance on the B+ side: corroded/loose terminal, fusible link or cable. The terminal also gets hot.')};}},
 {id:'c6',grp:'car',ic:'⏚',n:A('અર્થ સાઇડ વોલ્ટેજ ડ્રોપ','अर्थ साइड वोल्टेज ड्रॉप','Earth side voltage drop'),tool:A('મલ્ટિમીટર (V⎓)','मल्टीमीटर (V⎓)','Multimeter (V⎓)'),mode:'V ⎓',spec:A('≤ 0.2 V (≈ 50 A લોડ પર)','≤ 0.2 V (≈ 50 A लोड पर)','≤ 0.2 V (at ≈ 50 A load)'),
  steps:[A('લાલ પ્રોબ અલ્ટરનેટરના હાઉસિંગ પર, કાળી બેટરી (−) પર.','लाल प्रोब अल्टरनेटर के हाउसिंग पर, काली बैटरी (−) पर.','Red probe on the alternator housing, black on battery (−).'),A('એન્જિન 2000 rpm, ≈ 50 A લોડ.','इंजन 2000 rpm, ≈ 50 A लोड.','Engine 2000 rpm, ≈ 50 A load.')],
  svg:()=>SV.altr(70,95)+SV.batt(210,120)+'<path d="M70 135 C120 190 230 190 283 128" fill="none" stroke="#111" stroke-width="5" style="stroke:var(--ink)"/>'+SV.meter(130,10,'0.07')+SV.red('M147 80 Q90 70 70 56')+SV.blk('M175 80 Q260 80 283 112'),
  run(){applyBench({key:true,run:true,rpm:2000,loads:MID_LOADS()});const r=simAt({key:true,run:true,rpm:2000,loads:MID_LOADS()});const v=Math.max(0,jit(r.I*(state.fault==='groundRes'?0.012:0.0015),0.008));return {v:fmt(v,2),u:'V',pass:v<=0.2,note:v<=0.2?A('અર્થ પાથ બરાબર.','अर्थ पाथ ठीक.','Earth path is fine.'):A('ખરાબ અર્થ: માઉન્ટિંગ બોલ્ટ પર કાટ/રંગ, એન્જિન-બોડી અર્થ સ્ટ્રેપ ઢીલો. સાફ કરી કસો.','खराब अर्थ: माउंटिंग बोल्ट पर जंग/पेंट, इंजन-बॉडी अर्थ स्ट्रैप ढीला. साफ करके कसें.','Bad earth: rust/paint on the mounting bolts, loose engine-body earth strap. Clean and tighten.')};}},
 {id:'c7',grp:'car',ic:'〰️',n:A('AC રિપલ ટેસ્ટ (ડાયોડ)','AC रिपल टेस्ट (डायोड)','AC ripple test (diodes)'),tool:A('મલ્ટિમીટર (V~) કે ઓસિલોસ્કોપ','मल्टीमीटर (V~) या ऑसिलोस्कोप','Multimeter (V~) or oscilloscope'),mode:'V ~',spec:A('< 0.5 V AC','< 0.5 V AC','< 0.5 V AC'),
  steps:[A('મીટર AC વોલ્ટ પર, પ્રોબ B+ અને અર્થ પર.','मीटर AC वोल्ट पर, प्रोब B+ और अर्थ पर.','Meter on AC volts, probes on B+ and earth.'),A('એન્જિન 1500 rpm, મધ્યમ લોડ. DC પર ચડેલો AC "રિપલ" માપો.','इंजन 1500 rpm, मध्यम लोड. DC पर चढ़ा AC "रिपल" मापें.','Engine 1500 rpm, medium load. Measure the AC "ripple" riding on the DC.'),A('ઓસિલોસ્કોપ (સિમ્યુલેટરમાં "B+ DC + રિપલ") માં 6 સરખી પલ્સ દેખાવી જોઈએ.','ऑसिलोस्कोप (सिम्युलेटर में "B+ DC + रिपल") में 6 बराबर पल्स दिखनी चाहिए.','On a scope (simulator "B+ DC + ripple"), you should see 6 even pulses.')],
  svg:()=>SV.altr(240,95)+SV.meter(110,40,'0.06~')+SV.red('M127 110 Q170 150 258 109')+SV.blk('M155 110 Q190 160 240 135')+'<path d="M20 60 q10 -14 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#facc15" stroke-width="3"/>',
  run(){applyBench({key:true,run:true,rpm:1500,loads:MID_LOADS()});const r=simAt({key:true,run:true,rpm:1500,loads:MID_LOADS()});const v=Math.max(0.01,jit(r.ripple*0.38,0.01));return {v:fmt(v,2),u:'V~',pass:v<0.5,note:v<0.5?A('ડાયોડ અને સ્ટેટર બરાબર.','डायोड और स्टेटर ठीक.','Diodes and stator are fine.'):A('વધુ રિપલ = ખરાબ ડાયોડ કે ઓપન સ્ટેટર ફેઝ. રિપલ ECU, રેડિયો અને બેટરીને નુકસાન કરે. રેક્ટિફાયર/સ્ટેટર બેન્ચ ટેસ્ટ કરો.','ज़्यादा रिपल = खराब डायोड या ओपन स्टेटर फेज़. रिपल ECU, रेडियो और बैटरी को नुकसान करता है. रेक्टिफायर/स्टेटर बेंच टेस्ट करें.','High ripple = a bad diode or open stator phase. Ripple harms the ECU, radio and battery. Bench-test the rectifier and stator.')};}},
 {id:'c8',grp:'car',ic:'🌙',n:A('પાર્કિંગ ડ્રેઇન (લીકેજ) કરંટ','पार्किंग ड्रेन (लीकेज) करंट','Parasitic drain (key-off) current'),tool:A('મલ્ટિમીટર (A, સીરિઝમાં)','मल्टीमीटर (A, सीरीज़ में)','Multimeter (A, in series)'),mode:'A ⎓',spec:A('< 0.05 A (50 mA)','< 0.05 A (50 mA)','< 0.05 A (50 mA)'),
  steps:[A('ચાવી OFF, દરવાજા બંધ. બેટરી (−) ટર્મિનલ કાઢી તેની જગ્યાએ મીટર (10 A રેન્જ) સીરિઝમાં.','चाबी OFF, दरवाज़े बंद. बैटरी (−) टर्मिनल निकालकर उसकी जगह मीटर (10 A रेंज) सीरीज़ में.','Key OFF, doors shut. Remove battery (−) and put the meter (10 A range) in series.'),A('ECU ઊંઘી જાય ત્યાં સુધી 10–20 મિનિટ રાહ.','ECU सो जाए तब तक 10–20 मिनट इंतज़ार.','Wait 10–20 min for the modules to sleep.'),A('વધુ હોય તો અલ્ટરનેટરનો B+ કાઢી ફરી માપો — ઘટે તો અલ્ટરનેટરનો ડાયોડ લીક.','ज़्यादा हो तो अल्टरनेटर का B+ निकालकर फिर मापें — घटे तो अल्टरनेटर का डायोड लीक.','If high, disconnect alternator B+ and re-measure — if it drops, an alternator diode is leaking.')],
  svg:()=>SV.batt(30,110)+SV.meter(150,30,'0.03')+SV.red('M167 100 Q140 150 103 102')+SV.blk('M195 100 Q260 140 280 100')+'<text x="270" y="90">'+tx('ગાડી (−)','गाड़ी (−)','car (−)')+'</text>',
  run(){applyBench({key:false,run:false});const v=state.fault==='diodeShort'?jit(0.62,0.04):jit(0.03,0.006);return {v:fmt(v,2),u:'A',pass:v<0.05,note:v<0.05?A('ડ્રેઇન સામાન્ય.','ड्रेन सामान्य.','Drain is normal.'):A('વધુ ડ્રેઇન — B+ કાઢતાં ઘટ્યો → અલ્ટરનેટરનો શોર્ટ ડાયોડ. રાતભરમાં બેટરી ખાલી કરશે.','ज़्यादा ड्रेन — B+ निकालने पर घटा → अल्टरनेटर का शॉर्ट डायोड. रात भर में बैटरी खाली कर देगा.','High drain — drops when B+ is disconnected → a shorted alternator diode. It will flatten the battery overnight.')};}},
 {id:'b1',grp:'bench',ic:'🌀',need:'rotor',n:A('રોટર વાઇન્ડિંગ પ્રતિકાર','रोटर वाइंडिंग प्रतिरोध','Rotor winding resistance'),tool:A('મલ્ટિમીટર (Ω)','मल्टीमीटर (Ω)','Multimeter (Ω)'),mode:'Ω',spec:A('2.4–3.5 Ω (20 °C)','2.4–3.5 Ω (20 °C)','2.4–3.5 Ω (20 °C)'),
  steps:[A('રોટર બેન્ચ પર (V-બ્લોક). સ્લિપ રિંગ સાફ.','रोटर बेंच पर (V-ब्लॉक). स्लिप रिंग साफ.','Rotor on the bench (V-blocks). Slip rings clean.'),A('મીટર 200 Ω પર, પ્રોબ બે સ્લિપ રિંગ પર. પ્રોબનો પોતાનો પ્રતિકાર બાદ કરો.','मीटर 200 Ω पर, प्रोब दो स्लिप रिंग पर. प्रोब का अपना प्रतिरोध घटाएँ.','Meter on 200 Ω, probes on the two slip rings. Subtract the probe resistance.')],
  svg:()=>SV.rotor(170,120)+SV.meter(40,10,'2.8')+SV.red('M57 80 Q70 100 96 112')+SV.blk('M85 80 Q100 95 110 112'),
  run(){const F=state.fault;const v=F==='fieldOpen'?Infinity:jit(2.82,0.06);return {v:v===Infinity?'OL':fmt(v,2),u:'Ω',pass:v>=2.4&&v<=3.5,note:v===Infinity?A('OL = વાઇન્ડિંગ તૂટેલી (ઓપન) કે લીડ સ્લિપ રિંગથી છૂટી. રોટર બદલો.','OL = वाइंडिंग टूटी (ओपन) या लीड स्लिप रिंग से छूटी. रोटर बदलें.','OL = winding broken (open) or a lead off its slip ring. Replace the rotor.'):A('વાઇન્ડિંગ બરાબર. 2.4 થી ઓછું = આંટા શોર્ટ (વધુ ફિલ્ડ કરંટ, રેગ્યુલેટર બળે).','वाइंडिंग ठीक. 2.4 से कम = चक्कर शॉर्ट (ज़्यादा फील्ड करंट, रेगुलेटर जले).','Winding OK. Below 2.4 = shorted turns (excess field current, burns the regulator).')};}},
 {id:'b2',grp:'bench',ic:'🛡️',need:'rotor',n:A('રોટર ઇન્સ્યુલેશન (અર્થ) ટેસ્ટ','रोटर इंसुलेशन (अर्थ) टेस्ट','Rotor insulation (earth) test'),tool:A('મલ્ટિમીટર (Ω) / 500 V મેગર','मल्टीमीटर (Ω) / 500 V मेगर','Multimeter (Ω) / 500 V megger'),mode:'Ω',spec:A('OL (∞, > 1 MΩ)','OL (∞, > 1 MΩ)','OL (∞, > 1 MΩ)'),
  steps:[A('એક પ્રોબ કોઈ પણ સ્લિપ રિંગ પર, બીજી શાફ્ટ કે ક્લો-પોલ પર.','एक प्रोब किसी भी स्लिप रिंग पर, दूसरी शाफ्ट या क्लॉ-पोल पर.','One probe on either slip ring, the other on the shaft or a claw pole.'),A('મેગર ફક્ત અલ્ટરનેટરમાંથી કાઢેલા રોટર પર જ — રેગ્યુલેટર/ડાયોડ સાથે ક્યારેય નહીં!','मेगर सिर्फ अल्टरनेटर से निकाले रोटर पर ही — रेगुलेटर/डायोड के साथ कभी नहीं!','Megger only on a rotor removed from the alternator — never with the regulator/diodes connected!')],
  svg:()=>SV.rotor(170,120)+SV.meter(40,10,'OL')+SV.red('M57 80 Q70 100 96 112')+SV.blk('M85 80 Q160 60 230 116'),
  run(){const v=state.fault==='rotorGround'?jit(0.6,0.1):Infinity;return {v:v===Infinity?'OL':fmt(v,1),u:v===Infinity?'':'Ω',pass:v===Infinity,note:v===Infinity?A('ઇન્સ્યુલેશન બરાબર.','इंसुलेशन ठीक.','Insulation is good.'):A('વાઇન્ડિંગ શાફ્ટ/પોલ સાથે અડે છે (અર્થ). ફિલ્ડ કરંટ સીધો અર્થમાં → રેગ્યુલેટર બળે. રોટર બદલો.','वाइंडिंग शाफ्ट/पोल से छूती है (अर्थ). फील्ड करंट सीधा अर्थ में → रेगुलेटर जले. रोटर बदलें.','Winding touches the shaft/pole (earthed). Field current goes straight to earth → burns the regulator. Replace the rotor.')};}},
 {id:'b3',grp:'bench',ic:'🧲',need:'stator',n:A('સ્ટેટર વાઇન્ડિંગ કન્ટિન્યુટી','स्टेटर वाइंडिंग कंटिन्यूटी','Stator winding continuity'),tool:A('મલ્ટિમીટર (Ω, 200 Ω રેન્જ)','मल्टीमीटर (Ω, 200 Ω रेंज)','Multimeter (Ω, 200 Ω range)'),mode:'Ω',spec:A('દરેક જોડી U-V, V-W, W-U ≈ 0.05–0.2 Ω (સરખા)','हर जोड़ी U-V, V-W, W-U ≈ 0.05–0.2 Ω (बराबर)','Each pair U-V, V-W, W-U ≈ 0.05–0.2 Ω (equal)'),
  steps:[A('સ્ટેટરના લીડ રેક્ટિફાયરથી છૂટા. પ્રોબ ભેગા કરી લીડ પ્રતિકાર નોંધો.','स्टेटर के लीड रेक्टिफायर से छूटे. प्रोब मिलाकर लीड प्रतिरोध नोट करें.','Stator leads free of the rectifier. Touch the probes together and note lead resistance.'),A('U-V, V-W, W-U ત્રણે જોડી માપો. ત્રણે લગભગ સરખા અને બહુ ઓછા હોવા જોઈએ.','U-V, V-W, W-U तीनों जोड़ी मापें. तीनों लगभग बराबर और बहुत कम होने चाहिए.','Measure U-V, V-W and W-U. All three should be nearly equal and very low.')],
  svg:()=>SV.stator(170,130)+SV.meter(10,20,'0.12')+SV.red('M27 90 Q60 50 130 58')+SV.blk('M55 90 Q120 40 170 58'),
  run(){const op=state.fault==='statorOpen';const a=op?Infinity:jit(0.12,0.01),b=jit(0.12,0.01),c=op?Infinity:jit(0.12,0.01);const f=v=>v===Infinity?'OL':fmt(v,2);
   return {v:f(a),u:'Ω',pass:!op,table:'<table class="dtab"><tr><th>U–V</th><th>V–W</th><th>W–U</th></tr><tr><td class="'+(a===Infinity?'f':'g')+'">'+f(a)+'</td><td class="g">'+f(b)+'</td><td class="'+(c===Infinity?'f':'g')+'">'+f(c)+'</td></tr></table>',note:op?A('U વાળી બંને જોડી OL → U ફેઝ તૂટેલો (ઓપન). સ્ટેટર બદલો.','U वाली दोनों जोड़ी OL → U फेज़ टूटा (ओपन). स्टेटर बदलें.','Both pairs with U read OL → phase U is open. Replace the stator.'):A('ત્રણે ફેઝ સતત (કન્ટિન્યુઅસ) અને સરખા.','तीनों फेज़ सतत (कंटिन्यूअस) और बराबर.','All three phases continuous and equal.')};}},
 {id:'b4',grp:'bench',ic:'🛡️',need:'stator',n:A('સ્ટેટર ઇન્સ્યુલેશન (અર્થ) ટેસ્ટ','स्टेटर इंसुलेशन (अर्थ) टेस्ट','Stator insulation (earth) test'),tool:A('મલ્ટિમીટર (Ω) / મેગર','मल्टीमीटर (Ω) / मेगर','Multimeter (Ω) / megger'),mode:'Ω',spec:A('દરેક લીડથી કોર: OL (∞)','हर लीड से कोर: OL (∞)','Each lead to core: OL (∞)'),
  steps:[A('એક પ્રોબ લેમિનેશન કોર (સાફ જગ્યા) પર, બીજી U, V, W લીડ પર વારાફરતી.','एक प्रोब लेमिनेशन कोर (साफ जगह) पर, दूसरी U, V, W लीड पर बारी-बारी.','One probe on the clean lamination core, the other on U, V, W leads in turn.')],
  svg:()=>SV.stator(170,130)+SV.meter(10,20,'OL')+SV.red('M27 90 Q60 50 130 58')+SV.blk('M55 90 Q100 150 124 140'),
  run(){const g=state.fault==='statorGround';const v=g?jit(0.4,0.08):Infinity;const f=x=>x===Infinity?'OL':fmt(x,1);return {v:f(v),u:v===Infinity?'':'Ω',pass:!g,table:'<table class="dtab"><tr><th>U–'+tx('કોર','कोर','core')+'</th><th>V–'+tx('કોર','कोर','core')+'</th><th>W–'+tx('કોર','कोर','core')+'</th></tr><tr><td class="g">OL</td><td class="g">OL</td><td class="'+(g?'f':'g')+'">'+(g?f(v)+' Ω':'OL')+'</td></tr></table>',note:g?A('W ફેઝ કોરને અડે છે (ઇન્સ્યુલેશન બળી ગયું). સ્ટેટર બદલો — સામાન્ય રીતે વધુ ગરમીથી.','W फेज़ कोर से छूता है (इंसुलेशन जल गया). स्टेटर बदलें — आमतौर पर ज़्यादा गर्मी से.','Phase W touches the core (burnt insulation). Replace the stator — usually caused by overheating.'):A('ઇન્સ્યુલેશન બરાબર. વાઇન્ડિંગ કાળી/બળેલી ગંધવાળી હોય તો પણ બદલવી.','इंसुलेशन ठीक. वाइंडिंग काली/जली गंध वाली हो तो भी बदलें.','Insulation good. Still replace a winding that is black or smells burnt.')};}},
 {id:'b5',grp:'bench',ic:'➡️',need:'rectifier',n:A('રેક્ટિફાયર ડાયોડ ટેસ્ટ','रेक्टिफायर डायोड टेस्ट','Rectifier diode test'),tool:A('મલ્ટિમીટર (ડાયોડ મોડ →|)','मल्टीमीटर (डायोड मोड →|)','Multimeter (diode mode →|)'),mode:'→|',spec:A('ફોરવર્ડ 0.4–0.7 V, રિવર્સ OL — દરેક ડાયોડ','फॉरवर्ड 0.4–0.7 V, रिवर्स OL — हर डायोड','Forward 0.4–0.7 V, reverse OL — every diode'),
  steps:[A('રેક્ટિફાયર બેન્ચ પર. મીટર ડાયોડ મોડ (→|).','रेक्टिफायर बेंच पर. मीटर डायोड मोड (→|).','Rectifier on the bench. Meter on diode mode (→|).'),A('પોઝિટિવ ડાયોડ: લાલ પ્રોબ ફેઝ ટર્મિનલ, કાળી B+ હીટ સિંક → 0.5 V; પ્રોબ ઉલટાવો → OL.','पॉज़िटिव डायोड: लाल प्रोब फेज़ टर्मिनल, काली B+ हीट सिंक → 0.5 V; प्रोब उलटें → OL.','Positive diodes: red on phase terminal, black on B+ heat sink → 0.5 V; swap probes → OL.'),A('નેગેટિવ ડાયોડ: લાલ − હીટ સિંક, કાળી ફેઝ ટર્મિનલ → 0.5 V; ઉલટાવો → OL. એક્સાઇટર ડાયોડ પણ એ જ રીતે.','नेगेटिव डायोड: लाल − हीट सिंक, काली फेज़ टर्मिनल → 0.5 V; उलटें → OL. एक्साइटर डायोड भी इसी तरह.','Negative diodes: red on − heat sink, black on phase terminal → 0.5 V; swap → OL. Exciter diodes the same way.')],
  svg:()=>SV.diode(190,120)+SV.meter(20,20,'0.52')+SV.red('M37 90 Q80 130 140 120')+SV.blk('M65 90 Q160 70 240 120')+'<text x="190" y="170" text-anchor="middle" class="m">'+tx('ફોરવર્ડ: 0.5 V · રિવર્સ: OL','फॉरवर्ड: 0.5 V · रिवर्स: OL','forward: 0.5 V · reverse: OL')+'</text>',
  run(){const F=state.fault;const rows=[];['D1+','D2+','D3+','D1−','D2−','D3−','Dx1','Dx2','Dx3'].forEach((n,i)=>{let fw=jit(i>5?0.62:0.52,0.02),rv=Infinity;if(F==='diodeOpen'&&i===3){fw=Infinity;}if(F==='diodeShort'&&i===1){fw=0.0;rv=0.0;}rows.push([n,fw,rv]);});
   const bad=rows.filter(r=>r[1]===Infinity||r[2]!==Infinity||r[1]<0.3);const f=v=>v===Infinity?'OL':fmt(v,2);
   return {v:bad.length?bad[0][0]:'9/9',u:bad.length?'':'OK',pass:!bad.length,table:'<table class="dtab"><tr><th>'+tx('ડાયોડ','डायोड','Diode')+'</th><th>'+tx('ફોરવર્ડ','फॉरवर्ड','Forward')+'</th><th>'+tx('રિવર્સ','रिवर्स','Reverse')+'</th></tr>'+rows.map(r=>{const b=r[1]===Infinity||r[2]!==Infinity||r[1]<0.3;return '<tr><td>'+r[0]+'</td><td class="'+(b?'f':'g')+'">'+f(r[1])+'</td><td class="'+(b?'f':'g')+'">'+f(r[2])+'</td></tr>';}).join('')+'</table>',
    note:!bad.length?A('બધા 9 ડાયોડ એક જ દિશામાં કરંટ વહેવા દે છે — બરાબર.','सभी 9 डायोड एक ही दिशा में करंट बहने देते हैं — ठीक.','All 9 diodes conduct one way only — good.'):(bad[0][1]===Infinity?A('બંને દિશામાં OL = ડાયોડ ઓપન → આઉટપુટ ≈ 1/3 ઓછું. રેક્ટિફાયર બદલો.','दोनों दिशा में OL = डायोड ओपन → आउटपुट ≈ 1/3 कम. रेक्टिफायर बदलें.','OL both ways = open diode → output ≈ 1/3 down. Replace the rectifier.'):A('બંને દિશામાં ≈ 0 = ડાયોડ શોર્ટ → AC બેટરીમાં, વ્હાઇન, ડ્રેઇન. રેક્ટિફાયર બદલો.','दोनों दिशा में ≈ 0 = डायोड शॉर्ट → AC बैटरी में, व्हाइन, ड्रेन. रेक्टिफायर बदलें.','≈ 0 both ways = shorted diode → AC into the battery, whine, drain. Replace the rectifier.'))};}},
 {id:'b6',grp:'bench',ic:'📏',need:'regulator',n:A('બ્રશની લંબાઈ','ब्रश की लंबाई','Brush length'),tool:A('વર્નિયર કેલિપર','वर्नियर कैलिपर','Vernier caliper'),mode:'mm',spec:A('નવું ≈ 10.5 mm · ઓછામાં ઓછું 5 mm','नया ≈ 10.5 mm · न्यूनतम 5 mm','New ≈ 10.5 mm · minimum 5 mm'),
  steps:[A('રેગ્યુલેટર/બ્રશ હોલ્ડર બહાર કાઢો.','रेगुलेटर/ब्रश होल्डर बाहर निकालें.','Remove the regulator/brush holder.'),A('વર્નિયરની ડેપ્થ બારથી હોલ્ડરમાંથી બહાર નીકળતો બ્રશનો ભાગ માપો. બ્રશ સરળતાથી સરકે અને સ્પ્રિંગ દબાણ આપે તે પણ તપાસો.','वर्नियर की डेप्थ बार से होल्डर से बाहर निकला ब्रश का भाग मापें. ब्रश आसानी से सरके और स्प्रिंग दबाव दे यह भी जाँचें.','Measure the brush protrusion from the holder with the vernier depth bar. Also check the brushes slide freely and the springs push.')],
  svg:()=>'<rect x="110" y="40" width="100" height="60" rx="6" fill="#18191b"/><rect x="135" y="100" width="18" height="44" fill="#2a2a2c"/><rect x="167" y="100" width="18" height="34" fill="#2a2a2c"/><rect x="40" y="150" width="240" height="18" fill="#c4c9cd" stroke="#777"/><rect x="40" y="96" width="14" height="72" fill="#c4c9cd" stroke="#777"/><text x="160" y="190" text-anchor="middle" class="m">'+tx('વર્નિયર કેલિપર','वर्नियर कैलिपर','vernier caliper')+'</text>',
  run(){const w=state.fault==='brushWorn';const a=w?4.2:jit(9.6,0.2),b=w?4.6:jit(9.8,0.2);return {v:fmt(Math.min(a,b),1),u:'mm',pass:!w,table:'<table class="dtab"><tr><th>'+tx('બ્રશ 1','ब्रश 1','Brush 1')+'</th><th>'+tx('બ્રશ 2','ब्रश 2','Brush 2')+'</th></tr><tr><td class="'+(a<5?'f':'g')+'">'+fmt(a,1)+' mm</td><td class="'+(b<5?'f':'g')+'">'+fmt(b,1)+' mm</td></tr></table>',note:w?A('5 mm થી ઓછા — સ્પ્રિંગ દબાણ નહીં, સ્લિપ રિંગ સાથે સંપર્ક તૂટે → ફિલ્ડ નહીં → ચાર્જિંગ નહીં. બ્રશ (કે આખો રેગ્યુલેટર) બદલો.','5 mm से कम — स्प्रिंग दबाव नहीं, स्लिप रिंग से संपर्क टूटे → फील्ड नहीं → चार्जिंग नहीं. ब्रश (या पूरा रेगुलेटर) बदलें.','Below 5 mm — no spring pressure, contact with the slip rings breaks → no field → no charging. Replace the brushes (or the whole regulator).'):A('બ્રશ બરાબર.','ब्रश ठीक.','Brushes OK.')};}},
 {id:'b7',grp:'bench',ic:'⭕',need:'rotor',n:A('સ્લિપ રિંગ વ્યાસ અને રનઆઉટ','स्लिप रिंग व्यास और रनआउट','Slip-ring diameter & runout'),tool:A('માઇક્રોમીટર + ડાયલ ગેજ','माइक्रोमीटर + डायल गेज','Micrometer + dial gauge'),mode:'mm',spec:A('Ø ≥ 17.0 mm (નવું ≈ 18), રનઆઉટ ≤ 0.03 mm','Ø ≥ 17.0 mm (नया ≈ 18), रनआउट ≤ 0.03 mm','Ø ≥ 17.0 mm (new ≈ 18), runout ≤ 0.03 mm'),
  steps:[A('રોટર V-બ્લોક પર. રિંગ 600 ગ્રિટ પેપરથી સાફ.','रोटर V-ब्लॉक पर. रिंग 600 ग्रिट पेपर से साफ.','Rotor on V-blocks. Clean the rings with 600-grit paper.'),A('માઇક્રોમીટરથી વ્યાસ; ડાયલ ગેજ રિંગ પર રાખી રોટર ધીમે ફેરવી રનઆઉટ માપો.','माइक्रोमीटर से व्यास; डायल गेज रिंग पर रखकर रोटर धीरे घुमाकर रनआउट मापें.','Diameter with a micrometer; dial gauge on the ring, turn the rotor slowly for runout.')],

 {id:'b8',grp:'bench',ic:'🎛️',need:'regulator',n:A('રેગ્યુલેટર બેન્ચ ટેસ્ટ (કટ-ઓફ વોલ્ટેજ)','रेगुलेटर बेंच टेस्ट (कट-ऑफ वोल्टेज)','Regulator bench test (cut-off voltage)'),tool:A('વેરિયેબલ DC સપ્લાય 0–20 V + 12 V 2 W ટેસ્ટ લેમ્પ','वेरिएबल DC सप्लाई 0–20 V + 12 V 2 W टेस्ट लैम्प','Variable DC supply 0–20 V + 12 V 2 W test lamp'),mode:'V ⎓',spec:A('લેમ્પ 14.2–14.8 V પર બંધ થાય','लैम्प 14.2–14.8 V पर बंद हो','Lamp goes off at 14.2–14.8 V'),
  steps:[A('સપ્લાય (+) રેગ્યુલેટરના B+/D+ પર, (−) તેના અર્થ (D−) પર. ટેસ્ટ લેમ્પ બે બ્રશ વચ્ચે (રોટરની જગ્યાએ).','सप्लाई (+) रेगुलेटर के B+/D+ पर, (−) उसके अर्थ (D−) पर. टेस्ट लैम्प दो ब्रश के बीच (रोटर की जगह).','Supply (+) to the regulator B+/D+, (−) to its earth (D−). Test lamp across the two brushes (in place of the rotor).'),A('12 V પર લેમ્પ ચાલુ (ફિલ્ડ ON). સ્લાઇડરથી વોલ્ટેજ ધીમે ધીમે વધારો…','12 V पर लैम्प चालू (फील्ड ON). स्लाइडर से वोल्टेज धीरे-धीरे बढ़ाएँ…','At 12 V the lamp is on (field ON). Raise the voltage slowly with the slider…'),A('જે વોલ્ટેજે લેમ્પ બુઝાય તે કટ-ઓફ (સેટ પોઇન્ટ). 16 V સુધી ન બુઝાય = રેગ્યુલેટર શોર્ટ.','जिस वोल्टेज पर लैम्प बुझे वही कट-ऑफ (सेट पॉइंट). 16 V तक न बुझे = रेगुलेटर शॉर्ट.','The voltage where the lamp goes out is the cut-off (set point). Still on at 16 V = regulator shorted.')],

  slider:true,

 {id:'b9',grp:'bench',ic:'⚙️',need:'rotor',n:A('બેરિંગ ચેક','बेयरिंग चेक','Bearing check'),tool:A('હાથ + કાન (અને ડાયલ ગેજ)','हाथ + कान (और डायल गेज)','Hands + ears (and dial gauge)'),mode:'HAND',spec:A('સરળ, અવાજ વગર ફરે; પ્લે ≤ 0.05 mm','आसानी से, बिना आवाज़ घूमे; प्ले ≤ 0.05 mm','Turns smooth and silent; play ≤ 0.05 mm'),

  run(){const b=state.fault==='bearing';return {v:b?'0.12':'0.01',u:'mm',pass:!b,note:b?A('ખરબચડી, કરકરતી અને 0.12 mm પ્લે → બેરિંગ બદલો (બંને બદલવી સારી). ઢીલી બેરિંગથી રોટર સ્ટેટરને ઘસાઈ બંનેને નુકસાન.','खुरदुरी, कड़कड़ाती और 0.12 mm प्ले → बेयरिंग बदलें (दोनों बदलना अच्छा). ढीली बेयरिंग से रोटर स्टेटर से रगड़कर दोनों खराब.','Rough, gritty, 0.12 mm play → replace the bearing (best to do both). A loose bearing lets the rotor rub the stator and ruins both.'):A('બંને બેરિંગ સરળ અને શાંત.','दोनों बेयरिंग आसान और शांत.','Both bearings smooth and quiet.')};}}];

    tb('#0284c7',tx('ફેરાડેનો નિયમ:','फैराडे का नियम:','Faraday\'s law:'),tx('વાહક (તાર) સાથે જોડાયેલું ચુંબકીય ફ્લક્સ બદલાય ત્યારે તેમાં EMF (વોલ્ટેજ) પેદા થાય; ફ્લક્સ જેટલું ઝડપથી બદલાય, વોલ્ટેજ તેટલો વધુ.','चालक (तार) से जुड़ा चुंबकीय फ्लक्स बदले तब उसमें EMF (वोल्टेज) पैदा होता है; फ्लक्स जितना तेज़ी से बदले, वोल्टेज उतना ज़्यादा.','when the magnetic flux linking a conductor changes, an EMF is induced in it; the faster the change, the higher the voltage.'))+
    tb('#16a34a',tx('ફ્લેમિંગનો જમણા હાથનો નિયમ:','फ्लेमिंग का दाएँ हाथ का नियम:','Fleming\'s right-hand rule:'),tx('અંગૂઠો = ગતિ, પહેલી આંગળી = ફિલ્ડ (N→S), વચલી આંગળી = પેદા થતો કરંટ.','अंगूठा = गति, पहली उँगली = फील्ड (N→S), बीच की उँगली = पैदा होने वाला करंट.','thumb = motion, first finger = field (N→S), second finger = induced current.'))+
    tb('#9333ea',tx('અલ્ટરનેટરમાં ઊંધું:','अल्टरनेटर में उल्टा:','In the alternator it is reversed:'),tx('તાર (સ્ટેટર) સ્થિર છે અને ચુંબક (રોટર) ફરે છે. પરિણામ એ જ — દરેક N પછી S પસાર થાય એટલે વોલ્ટેજની દિશા બદલાય = AC.','तार (स्टेटर) स्थिर है और चुंबक (रोटर) घूमता है. परिणाम वही — हर N के बाद S गुज़रता है इसलिए वोल्टेज की दिशा बदलती है = AC.','the wires (stator) stand still and the magnet (rotor) turns. Same result — after every N comes an S, so the voltage reverses = AC.'))+
    '<div class="formula">e = B · l · v<br>E<sub>rms</sub> = 4.44 · f · N · Φ · k<sub>w</sub><br>f = p · n / 60 &nbsp; (p = '+tx('પોલ-પેર','पोल-पेयर','pole pairs')+' = 6)</div>'+
    '<p>'+tx('B = ફ્લક્સ ઘનતા (T), l = તારની લંબાઈ (m), v = ઝડપ (m/s), N = આંટા, Φ = પોલ દીઠ ફ્લક્સ (Wb), k<sub>w</sub> = વાઇન્ડિંગ ફેક્ટર. વોલ્ટેજ ઝડપ (f) અને ફ્લક્સ (Φ) બંને પર આધાર રાખે — ઝડપ તો એન્જિન નક્કી કરે, એટલે રેગ્યુલેટર Φ (ફિલ્ડ કરંટ) બદલીને વોલ્ટેજ કાબૂમાં રાખે છે.','B = फ्लक्स घनत्व (T), l = तार की लंबाई (m), v = गति (m/s), N = चक्कर, Φ = प्रति पोल फ्लक्स (Wb), k<sub>w</sub> = वाइंडिंग फैक्टर. वोल्टेज गति (f) और फ्लक्स (Φ) दोनों पर निर्भर — गति तो इंजन तय करता है, इसलिए रेगुलेटर Φ (फील्ड करंट) बदलकर वोल्टेज काबू में रखता है.','B = flux density (T), l = conductor length (m), v = speed (m/s), N = turns, Φ = flux per pole (Wb), k<sub>w</sub> = winding factor. Voltage depends on both speed (f) and flux (Φ) — the engine sets the speed, so the regulator controls the voltage by changing Φ (the field current).')+'</p>'+
    ex(tx('ઉદાહરણ 1','उदाहरण 1','Example 1'),tx('એન્જિન આઇડલ 800 rpm, પુલી રેશિયો 2.7 → અલ્ટરનેટર n = 800 × 2.7 = 2160 rpm. f = 6 × 2160 / 60 = 216 Hz. એન્જિન 6000 rpm → n = 16,200 rpm → f = 1620 Hz.','इंजन आइडल 800 rpm, पुली रेशियो 2.7 → अल्टरनेटर n = 800 × 2.7 = 2160 rpm. f = 6 × 2160 / 60 = 216 Hz. इंजन 6000 rpm → n = 16,200 rpm → f = 1620 Hz.','Engine idle 800 rpm, pulley ratio 2.7 → alternator n = 800 × 2.7 = 2160 rpm. f = 6 × 2160 / 60 = 216 Hz. Engine 6000 rpm → n = 16,200 rpm → f = 1620 Hz.')))+
  sec(3,tx('બાંધકામ — બધા ભાગો','बनावट — सभी भाग','Construction — every part'),'<p>'+tx('ક્રમ પ્રમાણે (બહારથી અંદર), સિમ્યુલેટરના ભાગો જેવો જ:','क्रम के अनुसार (बाहर से अंदर), सिम्युलेटर के भागों जैसा ही:','In stripping order (outside in), same as the simulator:')+'</p>'+parts+see(tx('ખોલવાનો ડેમો જુઓ','खोलने का डेमो देखें','Watch the dismantling demo'),'strip'))+
  sec(4,tx('ક્લો-પોલ રોટર અને ચુંબકીય સર્કિટ','क्लॉ-पोल रोटर और चुंबकीय सर्किट','Claw-pole rotor & magnetic circuit'),'<p>'+tx('શાફ્ટ પર એક જ ગોળ ફિલ્ડ વાઇન્ડિંગ છે. તેની બંને બાજુ સ્ટીલના બે "પંજા" (ક્લો) — દરેકમાં 6 આંગળા. કરંટ વહે ત્યારે એક પંજાના બધા આંગળા N અને બીજાના બધા S બને. આંગળા એકબીજામાં ગૂંથાયેલા હોવાથી રોટરની ફરતે N-S-N-S… કુલ 12 પોલ મળે — સાદી, મજબૂત અને સસ્તી ડિઝાઇન.','शाफ्ट पर एक ही गोल फील्ड वाइंडिंग है. इसके दोनों ओर स्टील के दो "पंजे" (क्लॉ) — हर एक में 6 उँगलियाँ. करंट बहे तब एक पंजे की सभी उँगलियाँ N और दूसरे की सभी S बनती हैं. उँगलियाँ आपस में गुँथी होने से रोटर के चारों ओर N-S-N-S… कुल 12 पोल मिलते हैं — सरल, मज़बूत और सस्ता डिज़ाइन.','A single round field winding sits on the shaft, with two steel "claws" either side — 6 fingers each. With current flowing, every finger of one claw becomes N and every finger of the other S. Because the fingers interlock, you get N-S-N-S… 12 poles around the rotor — simple, strong and cheap.')+'</p>'+flux+
    tb('#dc2626',tx('ફ્લક્સનો માર્ગ:','फ्लक्स का मार्ग:','Flux path:'),tx('N આંગળો → નાનો હવાનો ગેપ (0.3–0.5 mm) → સ્ટેટરના દાંત → (સ્ટેટર વાઇન્ડિંગને કાપીને) → બાજુનો S આંગળો → પોલ ડિસ્ક → શાફ્ટ કોર → પાછો N. ગેપ નાનો રાખવાથી ફ્લક્સ વધુ મળે.','N उँगली → छोटा हवा का गैप (0.3–0.5 mm) → स्टेटर के दाँत → (स्टेटर वाइंडिंग को काटकर) → पास की S उँगली → पोल डिस्क → शाफ्ट कोर → वापस N. गैप छोटा रखने से फ्लक्स ज़्यादा मिलता है.','N finger → small air gap (0.3–0.5 mm) → stator teeth → (cutting the stator winding) → neighbouring S finger → pole disc → shaft core → back to N. A small gap gives more flux.'))+
    tb('#ca8a04',tx('શેષ ચુંબકત્વ:','अवशिष्ट चुंबकत्व:','Residual magnetism:'),tx('ક્લો-પોલ સ્ટીલમાં થોડું ચુંબકત્વ રહી જાય છે — લેમ્પ ન હોય તો પણ બહુ ઊંચી ઝડપે અલ્ટરનેટર પોતાની મેળે શરૂ થઈ શકે (સિમ્યુલેટરમાં "લેમ્પ બલ્બ ઉડ્યો" ખામીમાં જુઓ).','क्लॉ-पोल स्टील में थोड़ा चुंबकत्व रह जाता है — लैम्प न हो तब भी बहुत ऊँची गति पर अल्टरनेटर अपने आप शुरू हो सकता है (सिम्युलेटर में "लैम्प बल्ब फ्यूज़" खराबी में देखें).','The claw steel keeps a little magnetism — even without the lamp, the alternator can start itself at very high speed (see the "lamp bulb blown" fault in the simulator).'))+see(tx('🧲 ચુંબક અને ફ્લક્સ જુઓ','🧲 चुंबक और फ्लक्स देखें','See 🧲 magnetism & flux'),'mag'))+
  sec(5,tx('સ્ટેટર અને 3-ફેઝ વાઇન્ડિંગ','स्टेटर और 3-फेज़ वाइंडिंग','Stator & 3-phase winding'),'<p>'+tx('સ્ટેટરના 36 ખાંચામાં ત્રણ સરખી વાઇન્ડિંગ (U, V, W) એવી રીતે ગોઠવેલી છે કે તેમના વોલ્ટેજ 120° (વિદ્યુત ખૂણો) અંતરે આવે. 36 ખાંચા ÷ 12 પોલ ÷ 3 ફેઝ = પોલ દીઠ ફેઝ દીઠ 1 ખાંચો. લેમિનેશન (પાતળી પ્લેટો) એડી-કરંટ નુકસાન ઘટાડે.','स्टेटर के 36 खाँचों में तीन बराबर वाइंडिंग (U, V, W) ऐसे लगी हैं कि उनके वोल्टेज 120° (विद्युत कोण) अंतर पर आएँ. 36 खाँचे ÷ 12 पोल ÷ 3 फेज़ = प्रति पोल प्रति फेज़ 1 खाँचा. लेमिनेशन (पतली प्लेटें) एडी-करंट नुकसान घटाते हैं.','Three identical windings (U, V, W) are laid in the 36 stator slots so that their voltages are 120° (electrical) apart. 36 slots ÷ 12 poles ÷ 3 phases = 1 slot per pole per phase. Laminations (thin sheets) cut eddy-current losses.')+'</p>'+sine+star+
    '<div class="formula">'+tx('સ્ટાર','स्टार','Star')+': U<sub>line</sub> = √3 · U<sub>phase</sub> · I<sub>line</sub> = I<sub>phase</sub><br>'+tx('ડેલ્ટા','डेल्टा','Delta')+': U<sub>line</sub> = U<sub>phase</sub> · I<sub>line</sub> = √3 · I<sub>phase</sub></div>'+
    '<p>'+tx('સ્ટાર: ઓછી ઝડપે વધુ વોલ્ટેજ → વહેલું કટ-ઇન (મોટા ભાગની કારમાં). ડેલ્ટા: ઊંચી ઝડપે વધુ કરંટ → મોટા આઉટપુટવાળા અલ્ટરનેટરમાં. કેટલાકમાં ન્યુટ્રલ (N) ને બે વધારાના ડાયોડથી જોડી 10–15% વધુ આઉટપુટ મેળવાય (8-ડાયોડ).','स्टार: कम गति पर ज़्यादा वोल्टेज → जल्दी कट-इन (ज़्यादातर कारों में). डेल्टा: ऊँची गति पर ज़्यादा करंट → बड़े आउटपुट वाले अल्टरनेटर में. कुछ में न्यूट्रल (N) को दो अतिरिक्त डायोड से जोड़कर 10–15% ज़्यादा आउटपुट मिलता है (8-डायोड).','Star: more voltage at low speed → early cut-in (most cars). Delta: more current at high speed → high-output alternators. Some connect the neutral (N) through two extra diodes for 10–15% more output (8-diode).')+'</p>'+see(tx('ફેઝ ગ્લો અને ઓસિલોસ્કોપ','फेज़ ग्लो और ऑसिलोस्कोप','Phase glow & oscilloscope'),'ph'))+
  sec(6,tx('રેક્ટિફિકેશન — AC થી DC','रेक्टिफिकेशन — AC से DC','Rectification — AC to DC'),'<p>'+tx('ડાયોડ કરંટને ફક્ત એક દિશામાં (એનોડ → કેથોડ) જવા દે. 6 ડાયોડનો "3-ફેઝ ફુલ-વેવ બ્રિજ": જે ફેઝ સૌથી વધુ પોઝિટિવ હોય તેનો પોઝિટિવ ડાયોડ અને જે સૌથી નેગેટિવ હોય તેનો નેગેટિવ ડાયોડ વહન કરે. પરિણામ B+ પર લગભગ સીધો DC, થોડો "રિપલ" સાથે.','डायोड करंट को सिर्फ एक दिशा में (एनोड → कैथोड) जाने देता है. 6 डायोड का "3-फेज़ फुल-वेव ब्रिज": जो फेज़ सबसे ज़्यादा पॉज़िटिव हो उसका पॉज़िटिव डायोड और जो सबसे नेगेटिव हो उसका नेगेटिव डायोड चालन करता है. परिणाम B+ पर लगभग सीधा DC, थोड़े "रिपल" के साथ.','A diode passes current one way only (anode → cathode). A 6-diode "3-phase full-wave bridge": the positive diode of the most positive phase and the negative diode of the most negative phase conduct. The result is almost smooth DC at B+, with a little "ripple".')+'</p>'+bridge+
    '<div class="formula">'+tx('રિપલ ફ્રિક્વન્સી','रिपल फ्रीक्वेंसी','Ripple frequency')+' = 6 · f &nbsp;·&nbsp; U<sub>DC</sub> ≈ 1.35 · U<sub>line,rms</sub> − 2 · U<sub>diode</sub></div>'+

    tb('#dc2626',tx('ધ્યાન:','ध्यान:','Note:'),tx('ડાયોડ બેટરીનો કરંટ પાછો સ્ટેટરમાં જવા દેતા નથી — એટલે DC ડાયનેમો જેવા કટ-આઉટ રિલેની જરૂર નથી. પણ બેટરી ઊંધી લગાવો તો ડાયોડ તરત બળે!','डायोड बैटरी का करंट वापस स्टेटर में जाने नहीं देते — इसलिए DC डायनेमो जैसे कट-आउट रिले की ज़रूरत नहीं. पर बैटरी उल्टी लगाएँ तो डायोड तुरंत जलें!','The diodes block battery current from flowing back into the stator — so no cut-out relay is needed as on a DC dynamo. But connect the battery backwards and the diodes burn instantly!'))+see(tx('ડાયોડ ગ્લો અને રિપલ','डायोड ग्लो और रिपल','Diode glow & ripple'),'dc'))+
  sec(7,tx('એક્સાઇટેશન અને ચાર્જ વોર્નિંગ લેમ્પ','एक्साइटेशन और चार्ज वॉर्निंग लैम्प','Excitation & the charge warning lamp'),
    '<ol><li><b>'+tx('ચાવી ON (એન્જિન બંધ):','चाबी ON (इंजन बंद):','Key ON (engine off):')+'</b> '+tx('બેટરી + → ઇગ્નિશન સ્વિચ → લેમ્પ → D+ → બ્રશ → ફિલ્ડ → રેગ્યુલેટર → અર્થ. લેમ્પ સળગે અને ≈ 0.15–0.3 A "પ્રી-એક્સાઇટેશન" કરંટ ફિલ્ડને થોડું ચુંબક બનાવે.','बैटरी + → इग्निशन स्विच → लैम्प → D+ → ब्रश → फील्ड → रेगुलेटर → अर्थ. लैम्प जलता है और ≈ 0.15–0.3 A "प्री-एक्साइटेशन" करंट फील्ड को थोड़ा चुंबक बनाता है.','Battery + → ignition switch → lamp → D+ → brushes → field → regulator → earth. The lamp lights and ≈ 0.15–0.3 A of "pre-excitation" current slightly magnetises the field.')+'</li>'+
    '<li><b>'+tx('એન્જિન ચાલુ:','इंजन चालू:','Engine running:')+'</b> '+tx('સ્ટેટર વોલ્ટેજ બનાવે → 3 એક્સાઇટર ડાયોડ D+ ને પોતાનો વોલ્ટેજ આપે ("સેલ્ફ-એક્સાઇટેશન"). હવે લેમ્પની બંને બાજુ (બેટરી અને D+) ≈ 14 V → કરંટ નહીં → લેમ્પ બુઝાય = ચાર્જિંગ ચાલુ.','स्टेटर वोल्टेज बनाता है → 3 एक्साइटर डायोड D+ को अपना वोल्टेज देते हैं ("सेल्फ-एक्साइटेशन"). अब लैम्प के दोनों ओर (बैटरी और D+) ≈ 14 V → करंट नहीं → लैम्प बुझे = चार्जिंग चालू.','The stator makes voltage → the 3 exciter diodes feed D+ ("self-excitation"). Now both sides of the lamp (battery and D+) are ≈ 14 V → no current → lamp goes out = charging.')+'</li>'+
    '<li><b>'+tx('ખામી:','खराबी:','Fault:')+'</b> '+tx('અલ્ટરનેટર ચાર્જ ન કરે તો D+ નીચો રહે → લેમ્પ સળગતો રહે. ડાયોડ ખામીમાં લેમ્પ ઝાંખો ઝબકે.','अल्टरनेटर चार्ज न करे तो D+ नीचा रहे → लैम्प जलता रहे. डायोड खराबी में लैम्प मंद झपके.','If the alternator isn\'t charging, D+ stays low → the lamp stays lit. With a diode fault the lamp glows dimly.')+'</li></ol>'+
    tb('#ca8a04',tx('શા માટે લેમ્પ જરૂરી?','लैम्प क्यों ज़रूरी?','Why the lamp matters:'),tx('બલ્બ ઉડી જાય તો પ્રી-એક્સાઇટેશન કરંટ ન મળે અને અલ્ટરનેટર સામાન્ય ઝડપે ચાર્જ શરૂ ન કરે. એટલે ઘણી ગાડીઓમાં લેમ્પની સમાંતર રેઝિસ્ટર (≈ 100 Ω) હોય છે.','बल्ब फ्यूज़ हो जाए तो प्री-एक्साइटेशन करंट न मिले और अल्टरनेटर सामान्य गति पर चार्ज शुरू न करे. इसलिए कई गाड़ियों में लैम्प के समांतर रेज़िस्टर (≈ 100 Ω) होता है.','If the bulb blows there is no pre-excitation, and the alternator won\'t start charging at normal speed. That\'s why many cars fit a resistor (≈ 100 Ω) in parallel with the lamp.'))+see(tx('લેમ્પ ડેમો','लैम्प डेमो','Lamp demo'),'lamp'))+
  sec(8,tx('વોલ્ટેજ રેગ્યુલેટર','वोल्टेज रेगुलेटर','Voltage regulator'),'<p>'+tx('વોલ્ટેજ ઝડપ સાથે વધે, પણ બેટરી અને સાધનોને સ્થિર ≈ 14.4 V જોઈએ. રેગ્યુલેટર B+ (કે બેટરી) વોલ્ટેજ માપે: ઓછું હોય તો ફિલ્ડ ચાલુ, વધુ હોય તો બંધ — સેકન્ડમાં સેંકડો વાર (PWM). સરેરાશ ફિલ્ડ કરંટ = ડ્યુટી × (U / R<sub>ફિલ્ડ</sub>).','वोल्टेज गति के साथ बढ़ता है, पर बैटरी और उपकरणों को स्थिर ≈ 14.4 V चाहिए. रेगुलेटर B+ (या बैटरी) वोल्टेज मापता है: कम हो तो फील्ड चालू, ज़्यादा हो तो बंद — सेकंड में सैकड़ों बार (PWM). औसत फील्ड करंट = ड्यूटी × (U / R<sub>फील्ड</sub>).','Voltage rises with speed, but the battery and loads need a steady ≈ 14.4 V. The regulator senses B+ (or battery) voltage: low → field on, high → field off — hundreds of times a second (PWM). Average field current = duty × (U / R<sub>field</sub>).')+'</p>'+
    '<div class="formula">I<sub>field</sub> = '+tx('ડ્યુટી','ड्यूटी','duty')+' × (14.4 − 1.2) / 2.8 Ω ≈ '+tx('ડ્યુટી','ड्यूटी','duty')+' × 4.7 A<br>'+tx('તાપમાન વળતર','तापमान क्षतिपूर्ति','Temperature compensation')+' ≈ −7 … −10 mV/°C</div>'+
    tbl([tx('પેઢી','पीढ़ी','Generation'),tx('કામ','काम','How it works')],[[tx('વાઇબ્રેટિંગ કોન્ટેક્ટ (જૂનું)','वाइब्रेटिंग कॉन्टैक्ट (पुराना)','Vibrating contact (old)'),tx('કોઇલ સ્પ્રિંગ-કોન્ટેક્ટ ખોલે-બંધ કરે, ઘસારો','कॉइल स्प्रिंग-कॉन्टैक्ट खोले-बंद करे, घिसाव','A coil opens/closes spring contacts; wears out')],[tx('ઇલેક્ટ્રોનિક / હાઇબ્રિડ IC','इलेक्ट्रॉनिक / हाइब्रिड IC','Electronic / hybrid IC'),tx('ઝેનર + પાવર ટ્રાન્ઝિસ્ટર; બ્રશ હોલ્ડર પર (આ મોડેલ)','ज़ेनर + पावर ट्रांज़िस्टर; ब्रश होल्डर पर (यह मॉडल)','Zener + power transistor; on the brush holder (this model)')],[tx('મલ્ટિફંક્શન (DFM)','मल्टीफंक्शन (DFM)','Multifunction (DFM)'),tx('ECU ને લોડ (DFM) સંકેત; લોડ-રિસ્પોન્સ — અચાનક લોડે ધીમે ફિલ્ડ વધારે','ECU को लोड (DFM) संकेत; लोड-रिस्पॉन्स — अचानक लोड पर धीरे फील्ड बढ़ाए','Load signal (DFM) to the ECU; load-response ramps the field slowly')],[tx('સ્માર્ટ ચાર્જિંગ (LIN/BSS)','स्मार्ट चार्जिंग (LIN/BSS)','Smart charging (LIN/BSS)'),tx('ECU સેટ પોઇન્ટ 12.5–15 V વચ્ચે બદલે: બ્રેકિંગે વધુ ચાર્જ, એક્સિલરેશને ઓછું → ઇંધણ બચત','ECU सेट पॉइंट 12.5–15 V के बीच बदले: ब्रेकिंग पर ज़्यादा चार्ज, एक्सीलरेशन पर कम → ईंधन बचत','ECU varies the set point 12.5–15 V: charge hard when braking, ease off when accelerating → saves fuel')]])+see(tx('ફિલ્ડ PWM જુઓ','फील्ड PWM देखें','See the field PWM'),'pwm'))+
  sec(9,tx('આઉટપુટ લાક્ષણિકતા, પાવર અને કાર્યક્ષમતા','आउटपुट विशेषता, पावर और दक्षता','Output characteristic, power & efficiency'),curve+
    '<ul><li><b>'+tx('કટ-ઇન ઝડપ','कट-इन गति','Cut-in speed')+'</b> ≈ 1000–1100 rpm: '+tx('અહીંથી વોલ્ટેજ બેટરી કરતાં વધે અને કરંટ મળવાનું શરૂ.','यहाँ से वोल्टेज बैटरी से ज़्यादा होता है और करंट मिलना शुरू.','from here the voltage exceeds the battery\'s and current starts to flow.')+'</li><li><b>'+tx('સ્વ-મર્યાદિત કરંટ:','स्व-सीमित करंट:','Self-limiting current:')+'</b> '+tx('ઝડપ વધે તેમ સ્ટેટરનો રિએક્ટન્સ (X = 2πfL) પણ વધે, એટલે કરંટ એક મહત્તમ પર સ્થિર — અલગ કરંટ રેગ્યુલેટરની જરૂર નથી.','गति बढ़ने पर स्टेटर का रिएक्टेंस (X = 2πfL) भी बढ़ता है, इसलिए करंट एक अधिकतम पर स्थिर — अलग करंट रेगुलेटर की ज़रूरत नहीं.','as speed rises, the stator reactance (X = 2πfL) rises too, so current levels off at a maximum — no separate current regulator needed.')+'</li><li><b>'+tx('કાર્યક્ષમતા','दक्षता','Efficiency')+'</b> ≈ 50–65%: '+tx('નુકસાન = તાંબું (I²R), લોખંડ (હિસ્ટેરેસિસ + એડી), ડાયોડ ડ્રોપ, ઘર્ષણ અને ફેનની હવા.','नुकसान = तांबा (I²R), लोहा (हिस्टेरेसिस + एडी), डायोड ड्रॉप, घर्षण और फैन की हवा.','losses = copper (I²R), iron (hysteresis + eddy), diode drop, friction and fan windage.')+'</li></ul>'+
    '<div class="formula">P<sub>out</sub> = U × I &nbsp;·&nbsp; P<sub>in</sub> = P<sub>out</sub> / η &nbsp;·&nbsp; T = P<sub>in</sub> / (2π n / 60)</div>'+
    ex(tx('ઉદાહરણ 2','उदाहरण 2','Example 2'),tx('14 V × 120 A = 1680 W આઉટપુટ. η = 0.6 → ઇનપુટ = 1680 / 0.6 = 2800 W ≈ 3.8 hp એન્જિનમાંથી! n = 6000 rpm પર ટોર્ક = 2800 / (2π × 6000 / 60) ≈ 4.5 N·m (અલ્ટરનેટર શાફ્ટ પર), ક્રેન્ક પર × 2.7 ≈ 12 N·m.','14 V × 120 A = 1680 W आउटपुट. η = 0.6 → इनपुट = 1680 / 0.6 = 2800 W ≈ 3.8 hp इंजन से! n = 6000 rpm पर टॉर्क = 2800 / (2π × 6000 / 60) ≈ 4.5 N·m (अल्टरनेटर शाफ्ट पर), क्रैंक पर × 2.7 ≈ 12 N·m.','14 V × 120 A = 1680 W output. η = 0.6 → input = 1680 / 0.6 = 2800 W ≈ 3.8 hp from the engine! At n = 6000 rpm torque = 2800 / (2π × 6000 / 60) ≈ 4.5 N·m on the alternator shaft, × 2.7 ≈ 12 N·m at the crank.'))+
    ex(tx('ઉદાહરણ 3','उदाहरण 3','Example 3'),tx('રાત્રે વરસાદમાં લોડ: ECU 12 + હેડલેમ્પ 11 + બ્લોઅર 14 + ડિફોગર 15 + વાઇપર 6 = 58 A. આઇડલ (2160 rpm) પર અલ્ટરનેટર ≈ 66 A આપે → બેટરી માટે ફક્ત 8 A બચે. રેડિએટર ફેન (22 A) ચાલુ થાય તો બેટરી ખાલી થવા લાગે — એટલે આઇડલ-અપ / મોટો અલ્ટરનેટર.','रात में बारिश में लोड: ECU 12 + हेडलैम्प 11 + ब्लोअर 14 + डिफॉगर 15 + वाइपर 6 = 58 A. आइडल (2160 rpm) पर अल्टरनेटर ≈ 66 A देता है → बैटरी के लिए सिर्फ 8 A बचते हैं. रेडिएटर फैन (22 A) चालू हो तो बैटरी खाली होने लगे — इसलिए आइडल-अप / बड़ा अल्टरनेटर.','Rainy night load: ECU 12 + headlamps 11 + blower 14 + defogger 15 + wipers 6 = 58 A. At idle (2160 rpm) the alternator gives ≈ 66 A → only 8 A left for the battery. When the radiator fan (22 A) cuts in, the battery starts discharging — hence idle-up / bigger alternators.'))+see(tx('I–n વક્ર લાઇવ','I–n वक्र लाइव','Live I–n curve'),'curve'))+
  sec(10,tx('કૂલિંગ, બેરિંગ અને અવાજ','कूलिंग, बेयरिंग और आवाज़','Cooling, bearings & noise'),'<p>'+tx('ડ્યુઅલ-ફેન કોમ્પેક્ટ અલ્ટરનેટરમાં બે આંતરિક ફેન રોટર સાથે ફરે: હવા બંને છેડેથી અક્ષીય દિશામાં અંદર આવે અને બાજુની બારીઓમાંથી રેડિયલ બહાર ફેંકાય. ડાયોડનું જંક્શન ≈ 200 °C થી ઉપર ન જવું જોઈએ, રેગ્યુલેટર ≈ 150 °C. બ્લેડ અસમાન અંતરે હોય જેથી સાયરન જેવો અવાજ ન આવે. કેટલાક મોટા અલ્ટરનેટર એન્જિન કૂલન્ટથી (વોટર-કૂલ્ડ) ઠંડા થાય.','ड्युअल-फैन कॉम्पैक्ट अल्टरनेटर में दो आंतरिक फैन रोटर के साथ घूमते हैं: हवा दोनों सिरों से अक्षीय दिशा में अंदर आती है और बगल की खिड़कियों से रेडियल बाहर फेंकी जाती है. डायोड का जंक्शन ≈ 200 °C से ऊपर नहीं जाना चाहिए, रेगुलेटर ≈ 150 °C. ब्लेड असमान दूरी पर होते हैं ताकि सायरन जैसी आवाज़ न आए. कुछ बड़े अल्टरनेटर इंजन कूलेंट से (वॉटर-कूल्ड) ठंडे होते हैं.','In a dual-fan compact alternator two internal fans turn with the rotor: air enters axially at both ends and is thrown out radially through the side windows. Diode junctions must stay below ≈ 200 °C, the regulator ≈ 150 °C. Blades are unevenly spaced to avoid a siren noise. Some big alternators are water-cooled by engine coolant.')+'</p>'+tb('#ca8a04',tx('બેરિંગ:','बेयरिंग:','Bearings:'),tx('આગળની મોટી બેરિંગ બેલ્ટનો ખેંચાણ ભાર લે, તેથી વહેલી ઘસાય. ઘસાયેલી બેરિંગ = ગડગડાટ; ઇલેક્ટ્રિકલ ખામી = ઝડપ સાથે વધતો સીટી જેવો "વ્હાઇન". ફરક પાડવા: બેલ્ટ કાઢી પુલી હાથથી ફેરવો.','आगे की बड़ी बेयरिंग बेल्ट का खिंचाव भार लेती है, इसलिए जल्दी घिसती है. घिसी बेयरिंग = गड़गड़ाहट; इलेक्ट्रिकल खराबी = गति के साथ बढ़ती सीटी जैसी "व्हाइन". फर्क करने के लिए: बेल्ट निकालकर पुली हाथ से घुमाएँ.','The big front bearing takes the belt pull, so it wears first. Worn bearing = rumble; electrical fault = a whistle-like "whine" rising with speed. To tell them apart: remove the belt and spin the pulley by hand.'))+see(tx('💨 હવાનો પ્રવાહ જુઓ','💨 हवा का प्रवाह देखें','See 💨 the airflow'),'air'))+
  sec(11,tx('ચાર્જિંગ સર્કિટ','चार्जिंग सर्किट','Charging circuit'),'<p>'+tx('B+ (જાડો કેબલ, ફ્યુઝિબલ લિંક સાથે) → બેટરી + અને બધા લોડ. D+/L → વોર્નિંગ લેમ્પ → ઇગ્નિશન સ્વિચ. હાઉસિંગ = અર્થ (B−). નીચે સિમ્યુલેટરની લાઇવ સર્કિટ:','B+ (मोटी केबल, फ्यूज़िबल लिंक सहित) → बैटरी + और सभी लोड. D+/L → वॉर्निंग लैम्प → इग्निशन स्विच. हाउसिंग = अर्थ (B−). नीचे सिम्युलेटर का लाइव सर्किट:','B+ (heavy cable with a fusible link) → battery + and all loads. D+/L → warning lamp → ignition switch. Housing = earth (B−). The simulator\'s live circuit:')+'</p>'+circ)+
  sec(12,tx('ટેસ્ટિંગ — સ્પેસિફિકેશન','टेस्टिंग — स्पेसिफिकेशन','Testing — specifications'),tbl([tx('ટેસ્ટ','टेस्ट','Test'),tx('સાધન','उपकरण','Tool'),tx('સ્પેક','स्पेक','Spec')],specRows)+'<p style="color:var(--mute);font-size:13px">'+tx('દરેક ટેસ્ટ "🧪 ટેસ્ટિંગ લેબ" ટૅબમાં પગલાં, આકૃતિ અને ડિજિટલ મીટર સાથે કરી શકાય.','हर टेस्ट "🧪 टेस्टिंग लैब" टैब में चरण, आकृति और डिजिटल मीटर के साथ कर सकते हैं.','Every test can be done in the "🧪 Testing lab" tab with steps, a diagram and a digital meter.')+'</p>'+see(tx('🧪 ટેસ્ટિંગ લેબ ખોલો','🧪 टेस्टिंग लैब खोलें','Open 🧪 the testing lab'),'test'))+
  sec(13,tx('ખામી નિદાન ચાર્ટ','खराबी निदान चार्ट','Fault-diagnosis chart'),tbl([tx('લક્ષણ','लक्षण','Symptom'),tx('સંભવિત કારણ','संभावित कारण','Likely cause'),tx('કયો ટેસ્ટ','कौन-सा टेस्ट','Which test')],faultRows)+see(tx('🕵️ રહસ્ય ખામી પડકાર','🕵️ रहस्य खराबी चुनौती','🕵️ Mystery-fault challenge'),'myst'))+
  sec(14,tx('સલામતી અને સાવચેતી','सुरक्षा और सावधानी','Safety & precautions'),'<ul>'+[
    A('કામ શરૂ કરતાં પહેલાં બેટરી (−) કાઢો. B+ હંમેશાં "જીવંત" છે — ચાવી બંધ હોય તો પણ.','काम शुरू करने से पहले बैटरी (−) निकालें. B+ हमेशा "जीवित" है — चाबी बंद हो तब भी.','Disconnect battery (−) before starting. B+ is always live — even with the key off.'),
    A('એન્જિન ચાલુ હોય ત્યારે બેટરી કે B+ ક્યારેય ન કાઢો — "લોડ ડમ્પ" થી 40–100 V નો ઝટકો ECU અને ડાયોડ બાળી શકે.','इंजन चालू हो तब बैटरी या B+ कभी न निकालें — "लोड डंप" से 40–100 V का झटका ECU और डायोड जला सकता है.','Never disconnect the battery or B+ with the engine running — the "load dump" spike (40–100 V) can kill the ECU and diodes.'),
    A('બેટરી ઊંધી (રિવર્સ પોલેરિટી) ન લગાવો; જમ્પ-સ્ટાર્ટ વખતે ધ્યાન.','बैटरी उल्टी (रिवर्स पोलैरिटी) न लगाएँ; जंप-स्टार्ट के समय ध्यान.','Never reverse the battery polarity; take care when jump-starting.'),
    A('B+ ને અર્થ સાથે શોર્ટ ન કરો, "તણખા ટેસ્ટ" ન કરો. DC ડાયનેમોની જેમ અલ્ટરનેટરને "પોલરાઇઝ/ફ્લેશ" ન કરો.','B+ को अर्थ से शॉर्ट न करें, "चिंगारी टेस्ट" न करें. DC डायनेमो की तरह अल्टरनेटर को "पोलराइज़/फ्लैश" न करें.','Never short B+ to earth or do a "spark test". Never "polarise/flash" an alternator like a DC dynamo.'),
    A('મેગર (ઇન્સ્યુલેશન ટેસ્ટર) ફક્ત છૂટા રોટર/સ્ટેટર પર — ડાયોડ અને રેગ્યુલેટર જોડેલા હોય ત્યારે નહીં.','मेगर (इंसुलेशन टेस्टर) सिर्फ अलग रोटर/स्टेटर पर — डायोड और रेगुलेटर जुड़े हों तब नहीं.','Megger only on a separated rotor/stator — never with diodes and regulator connected.'),
    A('ગાડી પર આર્ક વેલ્ડિંગ પહેલાં બેટરી અને અલ્ટરનેટરનો B+ કાઢો. એન્જિન પર પાણીનું હાઇ-પ્રેશર જેટ અલ્ટરનેટર પર ન મારો.','गाड़ी पर आर्क वेल्डिंग से पहले बैटरी और अल्टरनेटर का B+ निकालें. इंजन पर पानी का हाई-प्रेशर जेट अल्टरनेटर पर न मारें.','Disconnect the battery and alternator B+ before arc-welding on the car. Don\'t aim a pressure washer at the alternator.'),
    A('ફરતા બેલ્ટ અને પુલીથી હાથ, કપડાં અને વાળ દૂર. ઇમ્પેક્ટ ગનથી પુલી નટ ન ખોલો.','घूमते बेल्ट और पुली से हाथ, कपड़े और बाल दूर. इम्पैक्ट गन से पुली नट न खोलें.','Keep hands, clothes and hair away from the running belt and pulley. Don\'t undo the pulley nut with an impact gun.'),

function theoryAct(a){ac();SND.click();
  if(a==='test'||a==='myst'){TS.cur=a==='myst'?'myst':'c1';showTab('test');return;}
  showTab('sim');
  if(a==='work'){demoStart('work');return;}if(a==='strip'){demoStart('strip');return;}
  buildAll();state.key=true;state.running=true;if(state.rpm<1200){state.rpm=1500;$('rpm').value=1500;}renderDock();
  if(a==='mag'){state.mag=true;setTog($('tMag'),true);$('magLeg').hidden=false;state.cut=true;setTog($('tCut'),true);camPreset('cut');}
  if(a==='ph'||a==='dc'||a==='pwm'){state.scope=a;$('scopeSeg').querySelectorAll('button').forEach(x=>setTog(x,x.dataset.s===a));state.cut=true;setTog($('tCut'),true);camPreset('cut');setTimeout(()=>$('scope').scrollIntoView({behavior:'smooth',block:'center'}),300);}
  if(a==='lamp'){state.running=false;renderDock();camPreset('lamp');}
  if(a==='curve')setTimeout(()=>$('curve').scrollIntoView({behavior:'smooth',block:'center'}),300);
  if(a==='air'){state.flow=true;state.air=true;setTog($('tFlow'),true);camPreset('home');setTimeout(()=>{state.air=false;},20000);}}

const MQ={started:false,order:[],i:0,ok:0,done:0,wrong:[],ans:false,cur:null};
function mqIntro(){$('mqBox').innerHTML='<div class="card res"><div style="font-size:44px">📝</div><h2 style="font-size:24px">'+tx('અલ્ટરનેટર MCQ','अल्टरनेटर MCQ','Alternator MCQ')+'</h2><p style="font-size:16px">'+Q.length+' '+tx('પ્રશ્નો','प्रश्न','questions')+'</p><p style="color:var(--mute)">'+tx('ITI, ભરતી પરીક્ષા અને ટ્રેડ થિયરી માટે','ITI, भर्ती परीक्षा और ट्रेड थ्योरी के लिए','For ITI, recruitment and trade-theory exams')+'</p><div class="mact" style="justify-content:center"><button class="btn pri" id="mqGo" style="font-size:18px;padding:12px 22px">▶ '+tx('શરૂ કરો','शुरू करें','Start')+'</button></div></div>';$('mqGo').onclick=()=>{ac();SND.click();mqStart();};}
function mqStart(list){MQ.started=true;Object.assign(MQ,{order:shuffle((list||Q.map((_,i)=>i)).slice()),i:0,ok:0,done:0,wrong:[],ans:false,cur:null});mqRender();}
function mqRender(){const bx=$('mqBox');if(!MQ.started){mqIntro();return;}
  if(MQ.i>=MQ.order.length){const p=Math.round(MQ.ok/MQ.done*100)||0;SND.win();buzz([30,40,30]);
    bx.innerHTML='<div class="card res"><div style="font-size:40px">'+(p>=80?'🏆':p>=50?'👍':'💪')+'</div><div class="big">'+MQ.ok+' / '+MQ.done+'</div><p style="font-size:18px;font-weight:700">'+p+'% — '+(p>=80?tx('શાનદાર! તમે અલ્ટરનેટર એક્સપર્ટ છો','शानदार! आप अल्टरनेटर एक्सपर्ट हैं','Excellent! You\'re an alternator expert'):p>=50?tx('સારું! થિયરી ફરી વાંચો','अच्छा! थ्योरी फिर पढ़ें','Good! Read the theory again'):tx('હાર નહીં — સિમ્યુલેટર અને ટેસ્ટિંગ લેબ ફરી કરો','हार नहीं — सिम्युलेटर और टेस्टिंग लैब फिर करें','Don\'t give up — try the simulator and testing lab again'))+'</p><div class="mact" style="justify-content:center"><button class="btn pri" id="mqAgain">🔁 '+tx('ફરી શરૂ','फिर शुरू','Start again')+'</button>'+(MQ.wrong.length?'<button class="btn" id="mqWrong">❌ '+tx('ખોટા ફરી','गलत फिर','Retry wrong')+' ('+MQ.wrong.length+')</button>':'')+'</div></div>';
    $('mqAgain').onclick=()=>mqStart();if($('mqWrong'))$('mqWrong').onclick=()=>mqStart(MQ.wrong.slice());return;}
  const qq=Q[MQ.order[MQ.i]];const opts=MQ.cur&&MQ.cur.q===qq&&MQ.cur.keep?MQ.cur.opts:shuffle(qq.o.map((t,j)=>({t,c:j===0})));MQ.ans=false;MQ.cur={q:qq,opts};
  bx.innerHTML='<div class="mhead"><span class="score">'+tx('સાચા:','सही:','Correct:')+' <b>'+MQ.ok+'</b> / '+MQ.done+'</span><div class="mprog"><i style="width:'+(MQ.i/MQ.order.length*100)+'%"></i></div><span class="qno">'+(MQ.i+1)+' / '+MQ.order.length+'</span></div><div class="card"><div class="qno">📝 '+tx('પ્રશ્ન','प्रश्न','Question')+'</div><div class="qtext">'+L3(qq.q)+'</div><div class="opts">'+opts.map((o,j)=>'<button class="opt" data-j="'+j+'"><span class="k">'+tx('કખગઘ','कखगघ','ABCD')[j]+'</span><span>'+L3(o.t)+'</span></button>').join('')+'</div></div><div id="mqFb"></div>';}
$('mqBox').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||MQ.ans)return;ac();MQ.ans=true;const j=+b.dataset.j,{q:qq,opts}=MQ.cur,right=opts[j].c;MQ.done++;
  document.querySelectorAll('#mqBox .opt').forEach((x,k)=>{x.disabled=true;if(opts[k].c)x.classList.add('ok');});
  if(right){MQ.ok++;SND.ok();buzz(25);}else{b.classList.add('no');SND.bad();buzz([60,40,60]);MQ.wrong.push(MQ.order[MQ.i]);}
  const praise=[tx('સાચો જવાબ! 🎯','सही उत्तर! 🎯','Correct! 🎯'),tx('એકદમ બરાબર! ✓','बिल्कुल सही! ✓','Spot on! ✓'),tx('શાબાશ! 🔥','शाबाश! 🔥','Well done! 🔥'),tx('વાહ, સાચું! ⭐','वाह, सही! ⭐','Great! ⭐')][Math.random()*4|0];
  $('mqFb').innerHTML='<div class="expl'+(right?'':' bad')+'"><b class="v">'+(right?praise:tx('ખોટો. સાચો જવાબ: ','गलत. सही उत्तर: ','Wrong. Correct answer: ')+L3(qq.o[0]))+'</b>'+L3(qq.x)+'</div><div class="mact" style="margin-top:10px"><button class="btn pri" id="mqNext">'+tx('આગળ ➜','आगे ➜','Next ➜')+'</button></div>';
  document.querySelector('.mhead .score').innerHTML=tx('સાચા:','सही:','Correct:')+' <b>'+MQ.ok+'</b> / '+MQ.done;
  $('mqNext').onclick=()=>{MQ.i++;SND.click();mqRender();window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});};
  $('mqFb').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'nearest'});});

function showTab(t){state.tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p===t)));
  $('pSim').hidden=t!=='sim';$('pTest').hidden=t!=='test';$('pTh').hidden=t!=='th';$('pMcq').hidden=t!=='mcq';
  if(t!=='sim'&&D.mode)demoStop(true);
  if(t==='th')renderTheory();if(t==='mcq')mqRender();if(t==='test')renderTest();if(t==='sim')setTimeout(resize,0);window.scrollTo({top:0});}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;ac();SND.click();showTab(b.dataset.p);});
function setLang(l){LANG=l;ls('alt_lang',l);applyUI();refresh();gameRender();miniPool=[];minis.innerHTML='';$('meters').innerHTML='';
  if(state.tab==='th')renderTheory();if(state.tab==='test')renderTest();
  if(MQ.started&&MQ.i<MQ.order.length&&!MQ.ans){MQ.cur.keep=true;mqRender();MQ.cur.keep=false;}else mqRender();}
$('langSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.l===LANG)return;ac();SND.click();setLang(b.dataset.l);});
