 {cam:'cut',v:{cut:1,mag:1},key:1,run:0,rpm:[800,800],loads:NOLOAD,dur:10,t:A('1. ચાવી ON — રોટર ચુંબક બને','1. चाबी ON — रोटर चुंबक बने','1. Key ON — the rotor becomes a magnet'),x:A('ચાવી ON: બેટરી → લેમ્પ → D+ → બ્રશ → સ્લિપ રિંગ → <b style="color:#ff6a00">ફિલ્ડ વાઇન્ડિંગ</b>. આ નાનો "પ્રી-એક્સાઇટેશન" કરંટ આગળના પંજાને <b style="color:#dc2626">N</b> અને પાછળનાને <b style="color:#2563eb">S</b> બનાવે. ગુલાબી રેખા = ચુંબકીય ફ્લક્સ N → હવાનો ગેપ → સ્ટેટર → S.','चाबी ON: बैटरी → लैम्प → D+ → ब्रश → स्लिप रिंग → <b style="color:#ff6a00">फील्ड वाइंडिंग</b>. यह छोटा "प्री-एक्साइटेशन" करंट आगे के पंजे को <b style="color:#dc2626">N</b> और पीछे वाले को <b style="color:#2563eb">S</b> बनाता है. गुलाबी रेखा = चुंबकीय फ्लक्स N → हवा का गैप → स्टेटर → S.','Key ON: battery → lamp → D+ → brushes → slip rings → <b style="color:#ff6a00">field winding</b>. This small "pre-excitation" current makes the front claw <b style="color:#dc2626">N</b> and the rear claw <b style="color:#2563eb">S</b>. Pink lines = magnetic flux N → air gap → stator → S.')},
 {cam:'cut',v:{cut:1,mag:1},key:1,run:1,rpm:[300,330],loads:NOLOAD,dur:9,t:A('2. ફરતું ચુંબકીય ક્ષેત્ર','2. घूमता चुंबकीय क्षेत्र','2. A rotating magnetic field'),x:A('મોટર રોટર ફેરવે: 12 પોલ N-S-N-S… સ્ટેટરના દરેક દાંત પાસેથી વારાફરતી પસાર થાય. ફ્લક્સ દિશા બદલે એટલે સ્ટેટરના તારમાં વોલ્ટેજ પેદા થાય (ફેરાડે). હજી ઝડપ કટ-ઇન (≈ 1050 અલ્ટ. rpm) કરતાં ઓછી — ચાર્જિંગ નહીં.','मोटर रोटर घुमाती है: 12 पोल N-S-N-S… स्टेटर के हर दाँत के पास से बारी-बारी गुज़रते हैं. फ्लक्स दिशा बदलता है इसलिए स्टेटर के तारों में वोल्टेज पैदा होता है (फैराडे). अभी गति कट-इन (≈ 1050 अल्ट. rpm) से कम — चार्जिंग नहीं.','The motor turns the rotor: the 12 poles N-S-N-S… sweep past every stator tooth in turn. The flux keeps reversing, so voltage is induced in the stator wires (Faraday). Still below cut-in (≈ 1050 alternator rpm) — no charging yet.')},
 {cam:'stator',v:{cut:1},key:1,run:1,rpm:[900,900],loads:NOLOAD,scope:'ph',dur:10,t:A('3. સ્ટેટરમાં 3-ફેઝ AC','3. स्टेटर में 3-फेज़ AC','3. 3-phase AC in the stator'),x:A('સ્ટેટરની ત્રણ વાઇન્ડિંગ <b style="color:#ef4444">U</b>, <b style="color:#ca8a04">V</b>, <b style="color:#3b82f6">W</b> વારાફરતી ચમકે — દરેકનો વોલ્ટેજ 120° અંતરે. ઓસિલોસ્કોપમાં ત્રણ સાઇન વેવ જુઓ. f = 6 × rpm / 60.','स्टेटर की तीन वाइंडिंग <b style="color:#ef4444">U</b>, <b style="color:#ca8a04">V</b>, <b style="color:#3b82f6">W</b> बारी-बारी चमकती हैं — हर एक का वोल्टेज 120° अंतर पर. ऑसिलोस्कोप में तीन साइन वेव देखें. f = 6 × rpm / 60.','The three stator windings <b style="color:#ef4444">U</b>, <b style="color:#ca8a04">V</b>, <b style="color:#3b82f6">W</b> glow in turn — their voltages 120° apart. See the three sine waves on the oscilloscope. f = 6 × rpm / 60.')},
 {cam:'rear',v:{xray:1},key:1,run:1,rpm:[1200,1200],loads:{base:true,head:true},scope:'dc',dur:10,t:A('4. રેક્ટિફાયર: AC → DC','4. रेक्टिफायर: AC → DC','4. Rectifier: AC → DC'),x:A('પાછળનું કવર એક્સ-રેમાં: <b style="color:#16a34a">લીલા ચમકતા ડાયોડ</b> = હાલ વહન કરે છે. જે ફેઝ સૌથી + હોય તેનો પોઝિટિવ ડાયોડ, જે સૌથી − હોય તેનો નેગેટિવ ડાયોડ. B+ પર લગભગ સીધો DC, નાના 6-પલ્સ રિપલ સાથે.','पीछे का कवर एक्स-रे में: <b style="color:#16a34a">हरे चमकते डायोड</b> = अभी चालन कर रहे हैं. जो फेज़ सबसे + हो उसका पॉज़िटिव डायोड, जो सबसे − हो उसका नेगेटिव डायोड. B+ पर लगभग सीधा DC, छोटे 6-पल्स रिपल के साथ.','Rear cover in X-ray: <b style="color:#16a34a">green glowing diodes</b> = conducting now. The positive diode of the most + phase and the negative diode of the most − phase. Almost smooth DC at B+, with a small 6-pulse ripple.')},
 {cam:'lamp',v:{},key:1,run:0,rpm:[800,800],loads:NOLOAD,dur:8,t:A('5. ચાર્જ લેમ્પ — ચાવી ON','5. चार्ज लैम्प — चाबी ON','5. Charge lamp — key ON'),x:A('એન્જિન બંધ, ચાવી ON: <b style="color:#dc2626">લાલ લેમ્પ સળગે</b>. તેનો કરંટ જ ફિલ્ડને પ્રી-એક્સાઇટ કરે. લેમ્પ ન સળગે = બલ્બ/વાયર/બ્રશ ખામી.','इंजन बंद, चाबी ON: <b style="color:#dc2626">लाल लैम्प जलता है</b>. इसका करंट ही फील्ड को प्री-एक्साइट करता है. लैम्प न जले = बल्ब/वायर/ब्रश खराबी.','Engine off, key ON: <b style="color:#dc2626">the red lamp lights</b>. Its current pre-excites the field. No lamp = bulb/wire/brush fault.')},
 {cam:'lamp',v:{},key:1,run:1,rpm:[800,800],loads:NOLOAD,dur:8,t:A('6. એન્જિન ચાલુ — લેમ્પ બુઝાયો','6. इंजन चालू — लैम्प बुझा','6. Engine running — lamp out'),x:A('અલ્ટરનેટર ચાર્જ કરવા લાગે: એક્સાઇટર ડાયોડ D+ ને ≈ 14 V આપે. લેમ્પની બંને બાજુ સરખું વોલ્ટેજ → લેમ્પ બંધ = "ચાર્જિંગ ચાલુ".','अल्टरनेटर चार्ज करने लगता है: एक्साइटर डायोड D+ को ≈ 14 V देते हैं. लैम्प के दोनों ओर बराबर वोल्टेज → लैम्प बंद = "चार्जिंग चालू".','The alternator starts charging: the exciter diodes put ≈ 14 V on D+. Equal voltage on both sides of the lamp → lamp off = "charging".')},
 {cam:'bench',v:{},key:1,run:1,rpm:[1500,1500],loads:'all',scope:'pwm',dur:11,t:A('7. રેગ્યુલેટર — લોડ વધે તો?','7. रेगुलेटर — लोड बढ़े तो?','7. Regulator — what if the load rises?'),x:A('હેડલેમ્પ, બ્લોઅર, ડિફોગર, ફેન… બધું ચાલુ! વોલ્ટેજ પડવા માંડે એટલે રેગ્યુલેટર <b style="color:#f97316">ફિલ્ડ ડ્યુટી</b> વધારે (ઓસિલોસ્કોપ: PWM) → વધુ ફ્લક્સ → વધુ આઉટપુટ. વોલ્ટમીટર ≈ 14.4 V પર જ રહે, એમ્મીટર ઉપર જાય.','हेडलैम्प, ब्लोअर, डिफॉगर, फैन… सब चालू! वोल्टेज गिरने लगे तो रेगुलेटर <b style="color:#f97316">फील्ड ड्यूटी</b> बढ़ाता है (ऑसिलोस्कोप: PWM) → ज़्यादा फ्लक्स → ज़्यादा आउटपुट. वोल्टमीटर ≈ 14.4 V पर ही रहे, एमीटर ऊपर जाए.','Headlamps, blower, defogger, fan… everything on! As the voltage starts to dip, the regulator raises the <b style="color:#f97316">field duty</b> (scope: PWM) → more flux → more output. The voltmeter stays at ≈ 14.4 V while the ammeter climbs.')},
 {cam:'bench',v:{},key:1,run:1,rpm:[700,4000],loads:'all',dur:12,t:A('8. ઝડપ સાથે આઉટપુટ','8. गति के साथ आउटपुट','8. Output vs speed'),x:A('બધા લોડ ચાલુ રાખી એન્જિન 700 → 4000 rpm. આઇડલ પર આઉટપુટ લોડ કરતાં ઓછું (બેટરી ખાલી થાય, કરંટ −). ઝડપ વધે તેમ કરંટ વધે અને ≈ 120 A પર સ્થિર — સ્ટેટર રિએક્ટન્સ પોતે મર્યાદા મૂકે. "આઉટપુટ vs ઝડપ" ગ્રાફમાં નારંગી બિંદુ જુઓ.','सभी लोड चालू रखकर इंजन 700 → 4000 rpm. आइडल पर आउटपुट लोड से कम (बैटरी खाली हो, करंट −). गति बढ़ने पर करंट बढ़ता है और ≈ 120 A पर स्थिर — स्टेटर रिएक्टेंस स्वयं सीमा लगाता है. "आउटपुट vs गति" ग्राफ में नारंगी बिंदु देखें.','All loads on, engine 700 → 4000 rpm. At idle the output is less than the load (battery discharging, current −). Current rises with speed and levels off at ≈ 120 A — stator reactance sets the limit. Watch the orange dot on the "output vs speed" graph.')},
 {cam:'home',v:{},air:1,key:1,run:1,rpm:[3000,3000],loads:{base:true,head:true},dur:9,t:A('9. ઠંડક — બે ફેન','9. ठंडक — दो फैन','9. Cooling — two fans'),x:A('<b style="color:#0284c7">આછા વાદળી તીર</b> = ઠંડી હવા: બંને છેડેથી અંદર, ફેન તેને બાજુની બારીઓમાંથી બહાર ફેંકે. ડાયોડ, રેગ્યુલેટર અને વાઇન્ડિંગ ઠંડા રહે. 120 A પર ≈ 1 kW ગરમી!','<b style="color:#0284c7">हल्के नीले तीर</b> = ठंडी हवा: दोनों सिरों से अंदर, फैन उसे बगल की खिड़कियों से बाहर फेंकते हैं. डायोड, रेगुलेटर और वाइंडिंग ठंडे रहते हैं. 120 A पर ≈ 1 kW गर्मी!','<b style="color:#0284c7">Light-blue arrows</b> = cooling air: in at both ends, thrown out of the side windows by the fans. Keeps diodes, regulator and windings cool. At 120 A that\'s ≈ 1 kW of heat!')},
 {cam:'home',v:{},key:0,run:0,rpm:[800,800],loads:NOLOAD,dur:8,t:A('ડેમો પૂરો ✅','डेमो पूरा ✅','Demo complete ✅'),x:A('હવે જાતે કરો: "🛠 ખામી પસંદ કરો" માંથી ખામી મૂકી લક્ષણ જુઓ, પછી "🧪 ટેસ્ટિંગ લેબ" માં ટેસ્ટ કરો — અથવા "રહસ્ય ખામી" પડકાર રમો!','अब खुद करें: "🛠 खराबी चुनें" से खराबी डालकर लक्षण देखें, फिर "🧪 टेस्टिंग लैब" में टेस्ट करें — या "रहस्य खराबी" चुनौती खेलें!','Now try it yourself: set a fault in "🛠 Choose a fault" and watch the symptoms, then test it in "🧪 Testing lab" — or play the "mystery fault" challenge!')}];
function camPreset(k){
  if(k==='cut')animCam(V(0.3,0.2,0),V(0.6,3.2,13.5));else if(k==='stator')animCam(V(0,0.6,0),V(-3.5,4.2,9.5));
  else if(k==='rear')animCam(V(-2.6,0,0.2),V(-11.5,3.0,5.5));else if(k==='front')animCam(V(3.2,0,0),V(10,3.2,7.5));
  else if(k==='bench')animCam(V(-4.2,1.7,-8.4),V(-6.5,4.8,8.5));else if(k==='lamp')animCam(V(-6.6,-4.2,3.6),V(-8.6,-0.4,12.8));
  else if(k==='layout')animCam(V(12,-4,3.5),V(6,9,22));else frameHome();}
function plain(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function speak(t){if(!D.voice||!window.speechSynthesis)return;speechSynthesis.cancel();const code=LANG;const v=speechSynthesis.getVoices().find(q=>q.lang&&q.lang.toLowerCase().startsWith(code));
  if(!v){if(!speak.warned){speak.warned=1;toast(tx('આ ઉપકરણમાં ગુજરાતી અવાજ નથી — લખાણ વાંચો','इस डिवाइस में हिंदी आवाज़ नहीं है — लिखा हुआ पढ़ें','No voice for this language on this device'));}return;}
  const u=new SpeechSynthesisUtterance(plain(t));u.voice=v;u.lang=v.lang;u.rate=0.95;speechSynthesis.speak(u);}
function demoShow(title,text,stepTxt){$('demoCap').hidden=false;document.querySelector('.simmain').classList.add('demo');$('dcTitle').innerHTML=title;$('dcText').innerHTML=text;$('dcStep').textContent=stepTxt;$('dcPause').textContent=D.paused?'▶':'⏸';$('dcPrev').hidden=D.mode!=='work';speak(title+'. '+text);}
function setView(o){state.cut=!!o.cut;state.xray=!!o.xray;state.mag=!!o.mag;setTog($('tCut'),state.cut);setTog($('tXray'),state.xray);setTog($('tMag'),state.mag);$('magLeg').hidden=!state.mag;}
function workStep(i){const w=W[i];D.step=i;D.phase='work';D.t=0;D.dur=w.dur;state.air=!!w.air;
  setView(w.v);state.flow=true;setTog($('tFlow'),true);
  if(state.key!==!!w.key){state.key=!!w.key;SND.relay();}state.running=!!w.run;humInit();
  state.loads=w.loads==='all'?ALL_LOADS():Object.assign({},w.loads);renderLoads();
  D.rpm0=w.rpm[0];D.rpm1=w.rpm[1];state.rpm=w.rpm[0];$('rpm').value=state.rpm;
  if(w.scope){state.scope=w.scope;$('scopeSeg').querySelectorAll('button').forEach(x=>setTog(x,x.dataset.s===w.scope));}
  camPreset(w.cam);renderDock();demoShow(L3(w.t),L3(w.x),tx('કેવી રીતે કામ કરે','कैसे काम करता है','How it works')+' · '+(i+1)+' / '+W.length);}
function stripStep(){const p=nextPart();
  if(!p){D.phase='end';D.t=0;D.dur=7;state.sel=null;refresh();camPreset('layout');demoShow('🎉 '+tx('બધું ખૂલી ગયું','सब खुल गया','Fully stripped'),tx('ફક્ત પાછળનું હાઉસિંગ વાઇસમાં છે; બધા ભાગ બેન્ચની મેટ પર ક્રમમાં ગોઠવાયા. હવે "🧪 ટેસ્ટિંગ લેબ" માં બેન્ચ ટેસ્ટ કરો, અથવા "જોડવાનો ડેમો" જુઓ.','सिर्फ पीछे का हाउसिंग वाइस में है; सभी भाग बेंच की मैट पर क्रम से सजे. अब "🧪 टेस्टिंग लैब" में बेंच टेस्ट करें, या "जोड़ने का डेमो" देखें.','Only the rear housing is left in the vice; every part is laid out in order on the bench mat. Now do the bench tests in "🧪 Testing lab", or watch the assembly demo.'),'✅');return;}
  D.id=p.id;D.phase='show';D.t=0;D.count=removable.filter(id=>P[id].removed).length+1;state.sel=p.id;refresh();frameFrom(p.id);
  D.dur=Math.min(12,Math.max(5,plain(L3(p.h)).length/20+3));
  demoShow(L3(p.n),'<b>🔧 '+tx('કેવી રીતે ખોલવું:','कैसे खोलें:','How to remove:')+'</b> '+L3(p.h)+'<span class="dcSub">'+L3(p.d)+'</span>',tx('ખોલવાનો ડેમો','खोलने का डेमो','Dismantling demo')+' · '+D.count+' / '+removable.length);}
function buildStep(){const id=state.stack[state.stack.length-1];
  if(!id){D.phase='end';D.t=0;D.dur=7;state.sel=null;refresh();frameHome();demoShow('🎉 '+tx('અલ્ટરનેટર ફરી તૈયાર','अल्टरनेटर फिर तैयार','Alternator rebuilt'),tx('બધા ભાગ ઊંધા ક્રમમાં જોડાયા. હવે ચાવી ON કરી મોટર ચલાવો અને ચાર્જિંગ ટેસ્ટ કરો. અસલમાં થ્રુ બોલ્ટ ક્રોસમાં ટોર્ક કરો અને પુલી હાથથી ફેરવી તપાસો કે કશું ઘસાતું નથી.','सभी भाग उल्टे क्रम में जुड़ गए. अब चाबी ON करके मोटर चलाएँ और चार्जिंग टेस्ट करें. असल में थ्रू बोल्ट क्रॉस में टॉर्क करें और पुली हाथ से घुमाकर जाँचें कि कुछ रगड़ता नहीं.','Every part refitted in reverse order. Now turn the key ON, run the motor and test the charging. In real life torque the through bolts criss-cross and spin the pulley by hand to check nothing rubs.'),'✅');return;}
  const p=P[id];D.id=id;D.phase='show';D.t=0;state.sel=id;refresh();frameFrom(id);D.dur=6;
  demoShow('↩ '+L3(p.n),'<b>🔩 '+tx('ફિટિંગ / ટોર્ક:','फिटिंग / टॉर्क:','Fixing / torque:')+'</b> '+L3(p.f)+'<span class="dcSub">'+L3(p.d)+'</span>',tx('જોડવાનો ડેમો','जोड़ने का डेमो','Assembly demo')+' · '+(removable.length-state.stack.length+1)+' / '+removable.length);}
function demoStart(mode){ac();humInit();if(D.mode)demoStop(true);state.auto=null;state.pending=null;state.iso=null;if(state.quiz){state.quiz=null;gameRender();}
  D.mode=mode;D.paused=false;D.save={xray:state.xray,cut:state.cut,mag:state.mag};
  if(mode==='work'){if(ORDER.some(id=>P[id].removed)){buildAll();toast(tx('ડેમો માટે અલ્ટરનેટર ફરી જોડ્યો','डेमो के लिए अल्टरनेटर फिर जोड़ा','Alternator reassembled for the demo'));}
    if(state.fault!=='none'&&!TS.myst){state.fault='none';$('faultSel').value='none';renderFaultCap();}
    state.explode=0;$('explode').value=0;$('explodeOut').textContent='0%';state.sel=null;refresh();workStep(0);}
  else{setView({});state.running=false;state.key=false;renderDock();if(mode==='strip')stripStep();else buildStep();}
  renderDemoCard();}
function demoStop(silent){if(!D.mode)return;const was=D.mode;D.mode=null;$('demoCap').hidden=true;document.querySelector('.simmain').classList.remove('demo');if(window.speechSynthesis)speechSynthesis.cancel();
  if(was==='work'&&D.save)setView(D.save);state.air=false;renderDemoCard();if(!silent)SND.click();}
function demoAdvance(){
  if(D.mode==='work'){if(D.step+1<W.length)workStep(D.step+1);else{demoStop();SND.win();}return;}
  if(D.phase==='end'){demoStop();SND.win();return;}
  if(D.phase==='show'){if(D.mode==='strip')removePart(D.id);else installPart(D.id);D.phase='gap';D.t=0;D.dur=1.6;return;}
  if(D.phase==='gap'){if(D.mode==='strip')stripStep();else buildStep();}}
function demoTick(dt){if(!D.mode||D.paused)return;D.t+=dt*D.speed;
  if(D.phase==='work'&&D.rpm1!==D.rpm0){const f=Math.min(1,D.t/(D.dur*0.85));state.rpm=Math.round(D.rpm0+(D.rpm1-D.rpm0)*f);$('rpm').value=state.rpm;}
  $('dcBar').style.width=Math.min(100,D.t/D.dur*100)+'%';
  const speaking=D.voice&&window.speechSynthesis&&speechSynthesis.speaking;
  if(D.t>=D.dur&&!speaking)demoAdvance();}
function renderDemoCard(){$('dTitle').innerHTML='🎬 '+tx('ડેમો — જુઓ અને શીખો','डेमो — देखो और सीखो','Demo — watch and learn');
  const lab=(m,ic,t)=>D.mode===m?'⏹ '+tx('ડેમો બંધ કરો','डेमो बंद करें','Stop demo'):ic+' '+t;
  $('dWork').textContent=lab('work','▶',tx('અલ્ટરનેટર કેવી રીતે કામ કરે છે','अल्टरनेटर कैसे काम करता है','How the alternator works'));
  $('dStrip').textContent=lab('strip','🔧',tx('ખોલવાનો ડેમો — દરેક ભાગ, સાધન સાથે','खोलने का डेमो — हर भाग, औज़ार के साथ','Dismantling demo — every part, with tools'));
  $('dBuild').textContent=lab('build','🔁',tx('જોડવાનો ડેમો — ટોર્ક સાથે','जोड़ने का डेमो — टॉर्क के साथ','Assembly demo — with torque figures'));
  $('dBuild').disabled=!state.stack.length&&D.mode!=='build';
  $('dSpdL').textContent=tx('ઝડપ','गति','Speed');$('dVoice').textContent='🗣 '+tx('બોલીને સમજાવો','बोलकर समझाएँ','Read aloud');setTog($('dVoice'),D.voice);
  $('dSpeed').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.s===D.speed)));}
$('dWork').onclick=()=>D.mode==='work'?demoStop():demoStart('work');
$('dStrip').onclick=()=>D.mode==='strip'?demoStop():demoStart('strip');
$('dBuild').onclick=()=>D.mode==='build'?demoStop():demoStart('build');
$('dSpeed').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;D.speed=+b.dataset.s;SND.click();renderDemoCard();});
$('dVoice').onclick=()=>{D.voice=!D.voice;SND.click();if(!D.voice&&window.speechSynthesis)speechSynthesis.cancel();renderDemoCard();};
$('dcPause').onclick=()=>{D.paused=!D.paused;$('dcPause').textContent=D.paused?'▶':'⏸';if(window.speechSynthesis){D.paused?speechSynthesis.pause():speechSynthesis.resume();}};
$('dcNext').onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();D.t=D.dur;demoAdvance();};
$('dcPrev').onclick=()=>{if(D.mode==='work')workStep(Math.max(0,D.step-1));};
$('dcStop').onclick=()=>demoStop();

/* ---------------- loop ---------------- */
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
/* full screen: real browser full screen when allowed; otherwise fill the window (e.g. inside a frame) */
function fsLabel(){const on=document.body.classList.contains('fs');const b=$('fsBtn');if(!b)return;b.textContent=on?'✕ '+tx('ફુલ સ્ક્રીન બંધ','फुल स्क्रीन बंद','Exit full screen'):'⛶ '+tx('ફુલ સ્ક્રીન','फुल स्क्रीन','Full screen');b.setAttribute('aria-pressed',String(on));}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function fsSet(on){document.body.classList.toggle('fs',on);fsLabel();setTimeout(resize,60);}
function fsEnter(){const d=document.documentElement,rq=d.requestFullscreen||d.webkitRequestFullscreen;
  const fallback=()=>{document.body.classList.add('fsx');fsSet(true);};
  if(!rq||!(document.fullscreenEnabled||document.webkitFullscreenEnabled)){fallback();return;}
  try{const r=rq.call(d);if(r&&r.catch)r.catch(fallback);}catch(e){fallback();}}
function fsExit(){if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{document.body.classList.remove('fsx');fsSet(false);}}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{document.body.classList.remove('fsx');fsSet(!!fsEl());}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('fsx')){document.body.classList.remove('fsx');fsSet(false);}});
$('fsBtn').onclick=()=>{ac();SND.click();document.body.classList.contains('fs')?fsExit():fsEnter();};
if(matchMedia('(min-width:980px) and (pointer:fine)').matches){const once=e=>{document.removeEventListener('pointerdown',once,true);if(e.target.closest&&e.target.closest('#fsBtn'))return;if(!document.body.classList.contains('fs')&&(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsEnter();};document.addEventListener('pointerdown',once,true);}
/* auto-height when embedded (blog): same message as the other ITI labs */
(function(){if(window.parent===window)return;let lastH=0;const send=()=>{if(document.body.classList.contains('fs'))return;const w=document.querySelector('.wrap');const h=Math.ceil(w.getBoundingClientRect().bottom+(window.scrollY||0)+8);if(Math.abs(h-lastH)>4){lastH=h;try{window.parent.postMessage({dmHeight:h},"*");}catch(e){}}};
  try{new ResizeObserver(send).observe(document.querySelector('.wrap'));}catch(e){setInterval(send,800);}window.addEventListener("load",send);setTimeout(send,600);document.addEventListener('click',()=>setTimeout(send,350));})();
let last=performance.now(),uiTick=0;
/* render only while something changes */
let WAKE=performance.now();const wake=()=>{WAKE=performance.now();};
['pointerdown','pointermove','wheel','keydown','input','change','click','touchmove'].forEach(e=>addEventListener(e,wake,{passive:true,capture:true}));
controls.addEventListener('change',wake);new ResizeObserver(wake).observe(view);document.addEventListener('visibilitychange',wake);
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  demoTick(dt);const e=elec(dt);
  humSet(state.tab==='sim'||state.tab==='test'?e.n:0,e.I/120,state.fault==='diodeShort'||state.fault==='statorGround'||state.fault==='statorOpen',e.slip,state.fault==='bearing'&&e.n>0);
  if(state.pending){state.pending.t-=dt;$('bCd').style.width=Math.max(0,100*(1-state.pending.t/state.pending.T))+'%';
    if(state.pending.t<=0){const id=state.pending.id;state.pending=null;$('bCd').style.width='0';if(!removePart(id))refresh();}}
  else if($('bCd').style.width&&$('bCd').style.width!=='0px')$('bCd').style.width='0';
  if(state.auto){state.autoT-=dt;if(state.autoT<=0){state.autoT=0.6;
    if(state.auto==='strip'){const n=nextPart();if(n)removePart(n.id);else{state.auto=null;renderDock();SND.win();camPreset('layout');}}
    else{if(state.stack.length)installPart(state.stack[state.stack.length-1]);else{state.auto=null;renderDock();SND.win();frameHome();}}}}
  if(state.camAnim){const a=state.camAnim;a.t=Math.min(1,a.t+dt*1.6);const k=a.t*a.t*(3-2*a.t);controls.target.lerpVectors(a.ft,a.tt,k);camera.position.lerpVectors(a.fp,a.tp,k);if(a.t>=1)state.camAnim=null;}
  if(state.running||state.key||state.pending||state.auto||state.camAnim||D.mode)WAKE=now;
  const live=now-WAKE<1200&&!document.hidden;uiTick++;
  if(state.tab==='sim'&&view.clientWidth&&live){updateMechanics(dt);updateParts(dt,now);updateFx(dt);controls.update();renderer.shadowMap.needsUpdate=true;renderer.render(scene,camera);updateLabels();
    if(uiTick%2===0)drawScope();if(uiTick%4===0)renderMeters();if(uiTick%6===0)updCircuit();if(uiTick%8===0)drawCurve();}
  requestAnimationFrame(loop);}
setTog($('tColor'),false);setTog($('tFlow'),true);
applyUI();refresh();gameRender();mqIntro();renderMeters();drawScope();drawCurve();updCircuit();
requestAnimationFrame(loop);
})();
</script>
